; ============================================================================
;  Scavenger Sense
;  Written by the in-game menu. Hand edits are fine - anything you change
;  here is picked up on the next game load, and the menu will show it.
; ============================================================================

[General]

; Write per-object detail to
; Documents\My Games\Skyrim Special Edition\SKSE\ScavengerSense.log

; Menu language. "english", or any name with a matching
; Data\SKSE\Plugins\ScavengerSense_<name>.ini translation file.

; Stand down while a game menu is open, so nothing we draw or tint
; ends up on top of it. Turn this off if the sweep ever refuses to
; run - some HUD mods park a permanent menu on the stack.
menuAware = true

; End the sweep when a menu opens instead of just hiding it. This
; also strips the glow off every lit object.
stopOnMenu = true

; Treat a conversation the same way. Talking does not pause the game,
; so this has to be asked for by name - but a pulse going off while
; someone is mid-sentence breaks the scene more than a menu does.
muteInDialogue = true

; Hide the game's own interface. "HUD Menu" is the vanilla one and
; carries anything drawn into it, moreHUD included. Other mods own
; their own menus, so add their names to the list below, comma
; separated, and they go too. A mod drawing through ImGui rather than
; Scaleform cannot be reached this way at all.
hideGameHud = false
hideMenus = HUD Menu


[Hotkey]

; DirectX scan code of the key that triggers a sweep. Mouse buttons are
; 256 + button index (256 = LMB, 257 = RMB, 258 = MMB). -1 disables.
; Scan code list: https://ck.uesp.net/wiki/Input_Script
keyboard = 21

; Gamepad button, or -1 to disable. Xbox layout, SKSE macro codes:
;   266 D-Pad Up      267 D-Pad Down   268 D-Pad Left   269 D-Pad Right
;   270 Start/Menu    271 Back/View    272 Left Stick   273 Right Stick
;   274 Left Bumper   275 Right Bumper 276 A            277 B
;   278 X             279 Y            280 Left Trigger 281 Right Trigger
; The press is not swallowed, so the button still does its vanilla job too.
gamepad = 276

; How the button has to be pressed:
;   press  - fires the moment it goes down
;   double - two taps inside doubleTapWindow
;   hold   - held down for at least holdTime
trigger = double

; Maximum seconds between the two taps in double mode.
doubleTapWindow = 0.3

; Seconds the button must be held in hold mode.
holdTime = 0.45

; Pressing the key again while a sweep is running cancels it.
toggle = false

; Minimum seconds between sweeps.
cooldown = 0.5


[Scan]

; Radius in game units. 1500 is roughly 23 m, 2500 roughly 38 m.
radius = 2500

; Hard cap on objects per sweep, nearest first. Maximum 128.
maxObjects = 128

; Skip objects with no display name (invisible marker activators).
ignoreUnnamed = true

; Skip plants and ore veins you have already harvested.
ignoreHarvested = true

; Skip objects wearing the engine's placeholder name - "This should
; not be visible." and friends. Comma-separated substrings, matched
; case-insensitively; add localised or modded placeholders here.
ignorePlaceholders = true
placeholderNames = should not be visible

; When more objects qualify than there are slots, spread the picks
; evenly across the whole radius instead of taking the nearest ones.
; Without this the wave only covers the few metres around you.
spreadAcrossRadius = true

; How hard that spread leans toward what is near you.
;   1.0 = even. Sounds fair, is not: with 450 candidates and 96 slots
;         it keeps one object in five, and the crate at your feet is
;         as likely to be dropped as one across the valley.
;   2.2 = everything within a few paces survives, the far half is
;         sampled. This is the default.
;   4.0+ = almost everything near, only a token few at distance.
nearBias = 2.2


[Pulse]

; Seconds for the wave to travel from the nearest lit object to the
; furthest one. This is a time, not a speed, so the sweep reads the
; same whether the objects are spread out or packed into one room.
;   0 = no wave, everything lights on the same frame.
sweepTime = 1.2

; How long each object stays lit once the wave reaches it.
duration = 3

; Seconds spent fading a highlight in and out.
fadeIn = 0.15
fadeOut = 0.4


[Vision]

; Draw the glow regardless of depth - silhouettes through geometry.
; Note this defeats the depth test, not culling: an object the engine
; never submits still will not show.
throughWalls = true

; Higher = thinner rim, lower = the whole object glows.
edgeFalloff = 1.6

; Multiplies the category colours. Above 1.0 pushes toward white.
glowStrength = 1

; Throb. Amplitude 0 is a steady glow.
pulseAmplitude = 0.35
pulseFrequency = 1.2


[Labels]

; Draw the object's name over it while it is lit.
enable = true

; Dark plate behind the text so it stays readable.
backdrop = false

; Only label objects closer than this, in game units. 0 = no limit.
; A busy room can otherwise turn into a wall of text.
maxDistance = 1800

; Text height in pixels. The menu framework only ever bakes one font
; size and it is sized for menus, so tags are drawn scaled to this.
; 0 uses the menu size unchanged.
fontSize = 20

; People's tags are drawn this much bigger than an object's, and are
; placed over the head rather than at the base of the model.
actorScale = 1.4

; Draw a shape beside a person's name: a triangle for hostile, a
; circle for neutral, a diamond for an ally, a cross for a corpse.
; These are drawn as geometry, not glyphs, so no font can lose them.
icons = true

; Give things you have favourited a colour of their own and a
; slightly bigger tag. Favourites are a per-save inventory flag, so
; this is read fresh from the player on every sweep.
favourite = true
favouriteColor = 0xFFA600
favouriteScale = 1.2

; Fold tags with the same name that sit within this many units of
; each other into one, so a wine cellar reads "Wine x40" instead of
; forty overlapping words. 0 disables. People are never folded -
; two guards are two guards.
mergeDistance = 320

; Push tags that land on top of each other apart. The one nearest
; the camera keeps its position and the rest step upward, each with
; a hairline back down to what it names. declutterSteps caps how far
; a tag may be lifted before it gives up and overlaps anyway.
; Keep each tag over the thing it names while the sweep runs, instead
; of leaving it where that thing was standing when the wave reached it.
; Anchors are recomputed on the main thread about sixty times a second
; for the hundred-odd things a wave lights, which costs nothing worth
; measuring - but it is a switch in case you disagree.
follow = true

; What to do about somebody who is talking, for people running a mod
; that floats subtitles over the speaker's head:
;   0  nothing
;   1  hide their tag while they speak - the subtitle already names them
;   2  lift their tag by speakerLift units so both fit
speakerMode = 1
speakerLift = 90

declutter = true
declutterSteps = 6


[Ring]

; The ground ring that travels outward from your feet with the wave.
; It is drawn as real world-space points, so it climbs stairs and
; follows hills rather than sitting flat on the screen.
enable = true

color = 0xD6DCE0

; Line width in pixels, and the width of the soft halo behind it.
thickness = 2.5
glow = 6

; Trailing rings behind the leading edge, and the gap between them.
; 1 draws only the leading edge.
echoes = 3
echoGap = 0.09

; Lift above the ground, so the line does not fight with the floor.
height = 10

; How much further than the furthest lit object the ring travels.
; Above 1.0 it keeps going past the last highlight, which reads as
; the pulse carrying on into the distance.
lead = 1.35


[Tint]

; Desaturate and darken the world while the sweep runs.
; This drives the image space override the tonemapper reads, so it is
; a real desaturation and it survives Community Shaders.
enable = true

; Two ways in, both on by default. They carry identical values, so
; there is no cost to pushing on both, and which one actually reaches
; the frame depends on what owns the tonemapper.
;   useOverride  - ImageSpaceManager's spare override pointer
;   writeCurrent - write the live image space, restoring it after
useOverride = true
writeCurrent = true

; Old route: trigger the IMAD record shipped in the esp instead.
; Only useful under ENB presets that ignore the cinematic params.
useImageSpaceModifier = false

; Run our own full-screen shader pass after everything else in the
; frame. This is the only route that works under Community Shaders,
; because nothing runs after it to undo the result. It also takes
; over the vignette, doing it properly rather than with four
; gradient quads. Off until you ask for it: it is the one part of
; this mod that talks to the graphics pipeline directly. Any failure
; disables it for the session and says why in the log.
postProcess = true

; Multipliers applied to the current image space. 1.0 leaves alone.
; saturation 0.0 is full greyscale.
saturation = 0.35
brightness = 0.82
contrast = 1.18

; Overall blend of the effect, 0.0 to 1.0.
strength = 1

; Colour graded into the image while sensing, and how much of it.
castColor = 0x3A4A57
castAmount = 0.22

; Composited overlay drawn on the finished frame. Mostly a vignette:
; overlayFlat is the share of the strength spent as an even sheet of
; colour, the rest darkens the edges. All-flat looks like cellophane.
overlay = true
overlayColor = 0x141414
overlayStrength = 0.28
overlayFlat = 0.12


[Self]

; Tag yourself along with everything else. The sweep starts where you
; are standing, so your own tag appears on the first frame of it.
; You are never given a highlight - a glow around the camera is no use
; to anybody, and it would spend one of the 128 shader slots.
scan = true

; A shape beside your name saying what you currently are: a standing
; figure while mortal, a pair of fangs while vampiric, three claw marks
; while a werewolf or in vampire lord form.
icon = true

color = 0xEBEBEB
scale = 1.25

; Your health, magicka and stamina as three thin bars under your
; name, for as long as a sweep lasts. Only yours - a bar over every
; person in the radius is a wall of colour, and TrueHUD already
; covers anyone you are fighting. Pairs with playing the game with
; its own HUD hidden: sweep to check yourself.
bars = true
; always, change (a few seconds after a value moves) or notfull.
barsWhen = always
barWidth = 120
barHeight = 5
; below, above, left or right of your name. Left and right stand the
; bars upright and fill them from the bottom.
barPlace = below
; Slant, as a multiple of thickness. 0 is a plain rectangle.
barShear = 0.9
; Notches cut across the bar. 0 draws it smooth.
barSegments = 10
; Nudges in pixels, positive X right, positive Y down. barOffset
; moves the bars hanging off a name tag; overheadOffset moves the
; no-sweep stacks (combat bars and the over-your-head ones).
barOffsetX = 0
barOffsetY = 0
overheadOffsetX = 0
overheadOffsetY = 0
; How far each row is set back from the one before, so the stack
; reads as angled away rather than painted flat. 0 stacks them square.
barPerspective = 0.1
barGlow = true
; One set of colours for every bar drawn anywhere - yours, the corner
; readout, other people's.
healthColor = 0xC4564A
magickaColor = 0x7FA8C4
staminaColor = 0x8FA86B
frameColor = 0x3A4A57
; The same stack over your own head with no sweep running, third
; person only - the player's answer to the combat bars.
overhead = true
; always, change (a few seconds after a value moves) or notfull.
overheadWhen = change
; A readout pinned to a corner of the screen, drawn whether or not a
; sweep is running: off, topleft, topright, bottomleft, bottomright.
hudCorner = off
; always, change (appears for a few seconds when a value moves), or
; notfull (only what is below maximum).
hudShow = change
hudLinger = 3
hudFade = 1.5
hudX = 48
hudY = 48
hudScale = 1.6


[Player]

; What the sense reads off you beyond the three vitals, drawn as a
; stats row under the corner readout.
level = true
gold = true
weight = true
cold = true
; Editor ID of the global variable that says how cold you are, and
; the value that counts as fully frozen. Survival Mode's global is
; the default; the row hides itself when it does not exist.
coldGlobal = survival_coldlevel
coldMax = 100
; Their level in parentheses after the name, enemies included.
levelOthers = true
; Tag icons follow the drawn weapon - yours and theirs - instead of
; the relationship shape. The colour still says friend or foe.
weaponIcons = true
; A racial emblem beside people's tags and on your level entry,
; with a fang or paw mark after it for vampires and werewolves.
raceIcons = true
; Where the stats row lives: bars (riding the over-head stack),
; corner (under the corner readout), or both.
statsPlace = bars


[Tracks]

; Breadcrumb trails behind anyone the sense has touched - sweep-lit
; or fought - as chevrons on the ground pointing the way they went,
; fading with age. Recording starts at first contact; nobody's past
; is known before the sense saw them.
enabled = true
; Seconds a mark survives.
lifetime = 90
; A small label at the fresh end - whose footprints these are.
names = true
; Marks from another place are nonsense in this one; cleared on
; interior/worldspace transitions unless told otherwise.
clearOnTransition = true
; The wipe spares a marked quarry unless this says otherwise.
forgetMarked = false
; chevrons or footprints.
style = footprints
; A key of its own: press to hide or show every trail; press while
; aiming at somebody to start or stop tracking them.
key = -1
gamepad = 268
; How far the mark reaches, in units - hunting picks a deer across
; a valley, far beyond the crosshair's activate range.
range = 4096
; When trails show, which is also when the key works: crouchsense
; (a sweep opened while crouched reads the ground until it ends),
; sense (any sweep), crouch (crouching alone), or always. Marked
; quarry stay visible regardless; recording never stops.
reveal = crouchsense
; The corner notes - Tracking so-and-so, All trails wiped.
toasts = false
; Footprint style only: pad size scale, and how many recorded
; marks lie between drawn prints.
printScale = 1
printEvery = 1
; On arriving anywhere, open a recording window for everyone there
; - the sense remembers the room from the moment you entered.
autoCapture = true
; One quarry at a time unless enabled; multiple marks each take
; their own colour, trail and sweep glow agreeing.
multiMark = false
; The marking sign: corners, ring or chevron, and its colour when
; the target is not already marked.
aimStyle = corners
aimColor = 0xFFA600
; Which gesture wipes everything: hold, doubletap or off - and how
; long a hold must last.
wipe = off
holdTime = 0.5
; single = one trail key does it all by context; multi = a key per
; action, each with its own gesture (press, double or hold);
; allinone = everything on the sweep key - double tap sweeps, a
; lone press marks, a hold wipes.
keyMode = allinone
markKey = -1
markGamepad = -1
markGesture = press
showKey = -1
showGamepad = -1
showGesture = press
wipeKey = -1
wipeGamepad = -1
wipeGesture = hold
; A dead quarry slips the mark after this many seconds.
deathRelease = true
deathDelay = 10


[Vitals]

; The same bars over other people, for the length of a sweep only.
; Never persistent - a bar over everyone all the time is what a
; combat HUD mod is for. What this gives instead is every person a
; wave reached, through walls, across the whole radius, at once.
actors = true
; false draws health only.
actorsAll = true
; Only people hostile to you. Read from the engine's own hostility
; check rather than a faction list, so a modded enemy counts too.
; Rivals - people who dislike you but have not drawn - do not.
hostileOnly = true
; always, change (only someone just hurt) or notfull.
actorsWhen = always
; Draw the ceiling a survival mod has taken away as a dead zone at
; the end of the bar, instead of rescaling and pretending otherwise.
lostMax = true
; Frost over lost health, smoke over lost magicka and stamina.
lostFx = true
; In combat, anyone you have hit keeps bars over their head until
; the fight ends. If you run TrueHUD, leave this off - its
; recent-damage bars already cover it.
combat = true
; Magicka and stamina on the combat bars too. Its own switch, not
; actorsAll: mid-fight can want different information than a sweep.
combatAll = false
; Seconds the combat bars outlive the fight, and how long a fresh
; corpse keeps its drained bar.
combatLinger = 4
; Whenever this mod draws bars over somebody, ask TrueHUD to dismiss
; its own bar for them, so the two never stack. Does nothing when
; TrueHUD is not installed.
pushTrueHUD = true


[Titles]

; A small word above the name - Jarl, Blacksmith, Thane of Whiterun -
; saying what someone is to Skyrim rather than what they are to you.
; Who gets which title is set in ScavengerSense_titles.ini.
show = true

; Size of the title as a share of the name below it.
scale = 0.72

; Let each title use the colour its own rule asks for. Off makes them
; all the one colour below, which is calmer in a crowd.
ruleColor = true
color = 0x999999


[Arousal]

; Reads SLO Aroused NG, if you have it. A small flame on the right of
; the tag, filling from nothing at 0 to full at 100.
show = true

; Hide the flame below this figure, so people who are simply going
; about their day do not all carry one.
min = 20

; Print the figure beside the flame as well.
number = false

color = 0xD98F86


[Bonds]

; THIS SECTION WRITES TO YOUR SAVE. Everything else in this file only
; changes what you see; these change the game. A relationship rank is
; kept by the engine on the NPC's base form and stored in the save, so
; it survives uninstalling this mod and there is no undo. The previous
; value is written to ScavengerSense.log before anything is changed.

; Raise the relationship when a marker's tally reaches full.
promote = false

; Which rank to raise to. The game's own ladder:
;   4 lover      also grants a 500 gold free-theft allowance
;   3 ally       what a permanent follower gets
;   2 confidant
;   1 friend     the gentlest change that still meets the marriage gate
; Only ever raised, never lowered - the rank is one shared byte per
; pair and half the mods in your load order write to it.
promoteRank = 1

; Also add them to the vanilla marriage candidate faction. This one is
; held on the reference rather than on a record, so it is reversible.
; Marriage needs this AND a rank of at least 1 AND a voice type the
; wedding dialogue covers, so it is not a guarantee on its own.
promoteMarriage = false

; Purely a picture: swap the marker for its `iconFull` once the tally
; is full - a Dibella sigil becoming a Mara one. Writes nothing.
maraAtFull = true


[Sound]

; The chime played when a sweep starts. The sound itself lives at
; Sound\FX\ScavengerSense\sweep.wav - overwrite that file with any
; 16-bit PCM wav to make it yours.
enabled = true
volume = 1

; Raw form ID of a sound descriptor to play INSTEAD of the shipped
; chime, 0 uses the chime.
; Examples: 0x000C7A54 = MAGDetectLifeCast, 0x0003F925 = UIMenuOK
formID = 0x0


[Categories]

; Which kinds of object to light, and what colour each one glows (0xRRGGBB).

; Which actors to sense:
;   all    - anyone, corpses included. Corpses are lootable.
;   living - only the ones still breathing
;   dead   - only the bodies, for finding a kill in tall grass
actorFilter = all

; Only sense people who mean you harm: hostile by nature, or hostile
; because of something you did - anyone you have struck counts.
; Corpses stay with actorFilter above.
enemiesOnly = false

; An empty chest is an answer, not a find.
hideEmpty = true
; Nothing whose taking would be theft lights or gets a tag.
hideStealing = false

; Colour people by what they are to you rather than by the fact that
; they are people. "Someone is there" is much less useful than
; "someone is there and they want to kill you". This overrides the
; actorColor below, for the glow and the name tag alike.
actorByDisposition = true
; Colour by the relationship record as well, so a rival reads
; differently from a stranger even when nobody has drawn a weapon.
actorByRelationship = true
hostileColor = 0xCC2929
neutralColor = 0xCBCBCB
friendlyColor = 0x86AF79
rivalColor = 0x8C372E
loverColor = 0xD98F86
allyColor = 0x7FA8C4
deadColor = 0x696969

; <name>OutlineOnly draws just the rim with no interior glow, which
; reads as a clean silhouette and keeps overlapping shapes separate.

container = true
containerColor = 0xC4B393
containerOutlineOnly = true

door = true
doorColor = 0x8FA3AD
doorOutlineOnly = true

flora = true
floraColor = 0x8FA86B
floraOutlineOnly = true

gear = true
gearColor = 0xC98F63
gearOutlineOnly = true

alchemy = true
alchemyColor = 0xA8C48F
alchemyOutlineOnly = true

book = true
bookColor = 0xA896C4
bookOutlineOnly = true

valuable = true
valuableColor = 0xD9A441
valuableOutlineOnly = true

activator = true
activatorColor = 0xB8B8B8
activatorOutlineOnly = true

furniture = true
furnitureColor = 0xD9B166
furnitureOutlineOnly = true

actor = true
actorColor = 0xEBEBEB
actorOutlineOnly = true

[Markers]

; Appearance of the rules in ScavengerSense_marks.ini, matched by
; name. The rule file decides who a marker applies to; this decides
; what it looks like, so the menu can edit one without rewriting
; the other - and so a preset carries your marker styling with it.
;   style = number | fill | hidden
;   full  = the tally at which a filling icon is completely full

dibella.enabled = true
dibella.color = 0xD98F86
dibella.style = fill
dibella.full = 8

spouse.enabled = true
spouse.color = 0xFFA600
spouse.style = fill
spouse.full = 8

