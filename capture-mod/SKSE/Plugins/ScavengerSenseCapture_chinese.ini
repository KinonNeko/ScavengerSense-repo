[Translation]
Cancel queued screenshot=取消排队的截图
Capture after closing menu=关闭菜单后截图
Capture menu language=截图菜单语言
Close the framework menu within 30 seconds. The screenshot waits until keyboard/mouse capture is released.=请在30秒内关闭菜单框架，截图会等待菜单释放键鼠输入后执行。
Custom key from INI=来自 INI 的自定义按键
Default shortcut: Ctrl + Shift + F10=默认快捷键：Ctrl + Shift + F10
Enable screenshot add-on=启用截图扩展
Keys are not consumed. Using Print Screen or another mod's shortcut may also create their screenshot.=不会拦截按键；使用 Print Screen 或其他模组的快捷键时，也可能触发它们的截图。
Off=关闭
Open screenshot folder=打开截图目录
Optional screenshot add-on. Captures the presented SDR frame, including overlays already drawn.=可选截图扩展。保存提交显示的 SDR 画面，包含此前已绘制的叠加界面。
Preview limitation: HDR/10-bit and D3D12 frame-generation wrappers are not supported. Later render hooks can still change the final image.=预览版限制：暂不支持 HDR/10位与 D3D12 帧生成封装；之后执行的渲染钩子仍可能改变最终画面。
Print Screen=Print Screen
Relative folders are inside the Skyrim game directory, not Data or MO2 overwrite. PNG uses the current back-buffer resolution.=相对目录位于游戏本体目录下，不是 Data 或 MO2 overwrite。PNG 使用当前提交画面的分辨率。
Reload capture settings=重载截图设置
Save capture settings=保存截图设置
Screenshot folder=截图目录
Screenshot key=截图按键
Status and errors are also written to ScavengerSenseCapture.log.=状态与错误也会写入 ScavengerSenseCapture.log。
