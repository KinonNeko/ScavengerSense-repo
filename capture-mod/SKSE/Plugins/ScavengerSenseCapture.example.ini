; Optional screenshot add-on 0.1.0 beta. UTF-8.
; This is an EXAMPLE, not a loaded personal INI. Defaults work without it.
; Save capture settings in the menu to create ScavengerSenseCapture.ini,
; or copy this example to that filename before editing.
[General]
enabled = true
; auto follows the core mod's installer/personal INI language at startup/reload.
language = auto
; Relative to SkyrimSE.exe, not Data. An absolute directory is also accepted.
directory = Screenshots/ScavengerSense

[Hotkey]
; Windows virtual-key code, NOT an SKSE scan code. 121 / 0x79 = F10.
; 0 disables the keyboard shortcut. Keys are not swallowed from other mods.
key = 121
ctrl = true
shift = true
alt = false
