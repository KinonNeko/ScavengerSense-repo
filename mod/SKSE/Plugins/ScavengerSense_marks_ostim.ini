; ============================================================================
;  Scavenger Sense - OStim add-on
;
;  Everything in this file reads OStim Standalone's own records. It is a
;  separate file on purpose: delete it and the add-on is gone completely - no
;  rules, no marker, nothing left in the menu. Keep it and OStim appears on
;  the Add-ons page with its own switch.
;
;  The line syntax is documented in ScavengerSense_marks.ini.
; ============================================================================


; ---------------------------------------------------------------------------
;  OStim integration: people the player has actually been with.
;
;  This whole block reads OStim Standalone's own bookkeeping. Nothing here is
;  our data, so it is grouped under one switch in the menu - Tags -> Custom
;  markers -> Integrations -> OStim - which turns the marker and the tally off
;  together. If OStim.esp is not in your load order the menu says so and the
;  rule stays quiet.
;
;  OStim records what has happened between you and an NPC in ordinary FormLists
;  inside its own plugin, writing to them on every node change of any scene the
;  player is in. No API, no script, no dependency.
;
;  The marker itself is membership of OStatSexualWithPlayerMateList (0x89E).
;  Other tiers, if you want a narrower or broader definition:
;    0x89A  romantic - kissing
;    0x89D  sensual  - cuddling, holding, groping
;    0x88B  intercourse only
;    0x89F  they climaxed with the player
;    0x8A0  the player climaxed with them
;
;
;  ABOUT THE NUMBER - please read, because the obvious approach does not work.
;
;  OStim appears to keep per-NPC tallies as faction ranks, and its own docs say
;  so. Those ranks do not increment. In skse/src/GameAPI/GameFaction.cpp both
;  getRank and setRank read TESNPC::factions - the static array from the plugin
;  record - while add() calls Actor::AddToFaction, which writes
;  ExtraFactionChanges on the reference. So the first event adds rank 1; every
;  later one reads -2 from an array that will never contain the faction, and the
;  rank is pinned at 1 forever. All 638 of its stat factions are booleans
;  wearing a number's clothes.
;
;  Its FormLists are sound, so the tally below is built from those instead.
;  Each countLists line is one point: "how many distinct things have you two
;  done". That is a real, monotonic number, and a more interesting one than a
;  raw count.
;
;
;  HOW THE LINES BELOW WERE CHOSEN
;
;  Every form ID here was read out of OStim.esp itself and cross-checked against
;  the action and tag JSON in Data\SKSE\Plugins\OStim\ , which is what decides
;  which list each act writes to. Three things that came out of that and shape
;  the list:
;
;  1. Each act writes to its OWN list and to every umbrella its tags name. So
;     vulval licking lands in VulvalLicking, VulvalStimulation, Cunnilingus,
;     AnyLicking, AnyOral and SexualMate all at once. Counting the umbrellas
;     alongside the specific acts would score one act five or six times, so the
;     umbrellas are excluded - EXCEPT where an act has no list of its own.
;
;  2. 34 of OStim's 84 actions have no list of their own and are recorded ONLY
;     in an umbrella. Kissing, cuddling, hugging, spooning, massaging, groping,
;     breast play, hair pulling and hand holding are all in that group. Before
;     this was understood the tally ignored them completely, which is why a
;     scene made mostly of those barely moved the number - the difference is
;     most obvious between scenes of different kinds, since animation packs vary
;     enormously in how much of what they do OStim can name. The last four lines
;     are the umbrellas that cover those acts, so they now score.
;
;  3. tribbing is the only act in the whole set whose list is one-sided:
;     tribbing.json declares OStatTribbingWithPlayerMateList only in its `actor`
;     block, not its `target` block. So the point below is scored only when the
;     NPC is the action's actor. Which participant that is comes from the
;     animation pack's scene file, not from OStim and not from us, so the same
;     act can score with one pack and not another. Nothing can be done about
;     this from here; the umbrella lines below cover the scene anyway.
;
;  Also worth knowing: OStim writes the NPC's BASE form into these lists, which
;  is why uniqueOnly matters so much here. And OStimAnalStimulation 0x86C-0x86F
;  is dead - referenced by nothing, always empty - the live one is 0x9FF.
;
;  A male/female pairing can reach about 32 of these lines, female/female about
;  21, and same-sex pairings can reach the rest too whenever a strap-on is in
;  play, which OStim allows for any NPC. "Full at 8" in the menu is a good
;  default for all of them.
;
;  If a number looks wrong: put the crosshair on the person, open the menu and
;  press "Explain for my target" on the Tags page. It lists every line below and
;  says which ones that person is in.
; ---------------------------------------------------------------------------
[Dibella]
integration = OStim
requires = OStim.esp
