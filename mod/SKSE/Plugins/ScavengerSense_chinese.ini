"When something changes" keeps the screen clear until a value\nmoves - taking a hit, casting, drinking, or regenerating - then\nshows the bars for a few seconds and fades them out again.=“数值变化时”平常保持画面干净，直到某项数值发生变动——\n受击、施法、喝药或自然回复——才显示几秒钟，然后淡出。
Stays up for=停留时间
Fading over=淡出用时
Corner size=角落显示大小
