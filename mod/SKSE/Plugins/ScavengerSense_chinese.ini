The body and the head come off the skeleton. The bow follows the\nweapon node, which moves as you draw and loose - so it is the\nliveliest of the three, and the one most likely to sit oddly if a\nmod has changed the skeleton.=身体与头顶取自骨骼。弓则跟随武器节点，\n该节点在拉弓与放箭时会移动——因此三者中\n它最活跃，也最容易在骨骼被 Mod 替换后\n出现位置偏差。
