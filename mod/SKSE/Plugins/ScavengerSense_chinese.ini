The same stack the combat bars use, following you in third person\nwhether or not anything else is happening. In first person there is\nno head to hang them over - that is what the corner readout below\nis for.=与战斗状态条同一套条形，第三人称下始终跟着你，\n无论是否发生别的事情。第一人称没有头顶可挂——\n那正是下面角落面板的用途。
Show these=显示时机
"When something changes" uses the same linger and fade the other\nbars do, set under Bar style.="数值变化时"与其它状态条共用同一套停留和淡出时间，\n在"状态条外观"里设置。

