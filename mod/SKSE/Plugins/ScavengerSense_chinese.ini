The same bars pinned to the screen, drawn whether or not a sweep is\nrunning. This is the part that works in first person, where there is\nno character to hang a tag on.=把同样的状态条固定在屏幕上，无论是否正在扫描都会显示。\n第一人称下也能用——那时候没有角色可以挂标签。
