Always, only while the bow is actually being pulled - through to\nthe end of the follow-through, so it does not blink out as you\nloose - or only for the length of a sweep.=始终显示；仅在实际拉弓时显示——一直持续到\n收势结束，因此不会在放箭瞬间闪断；\n或仅在一次感知的持续时间内显示。
Its own fade, nothing else's. Zero on either side snaps instead\nof easing.=它自己的淡入淡出，与其他设置无关。任一侧\n设为零则直接切换，不做过渡。
How much of the drawn ammunition you have, hung in the world\nrather than pinned to a corner. Only appears with a bow or a\ncrossbow actually out.=你携带的当前弹药数量，悬挂在世界中\n而非固定于屏幕角落。仅在手持弓或\n弩时显示。
