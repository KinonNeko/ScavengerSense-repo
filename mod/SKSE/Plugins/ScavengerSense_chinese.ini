A vein you have already worked stops lighting up. It is judged by\nwhether it still lets you mine it, which is the only part of its\nstate readable from outside its script - so a mod that reworks\nmining may not be caught.=已被你开采过的矿脉不再发光。它按是否\n还允许开采来判断——这是脚本之外唯一\n能读到的状态，因此改动采矿机制的 Mod\n可能无法被正确识别。
