Save switches and colours=保存开关与颜色
Keeps what you ticked or recoloured in the table across restarts.\nWritten to its own file; the hand-written title file is never touched.=把你在表格里勾选或改色的结果保存下来，重启后仍然有效。\n写入单独的文件，绝不碰手写的称号文件。

Only enemies=只感知敌人
Nothing lights or gets a tag unless it means you harm: hostile by\nnature, attacking you right now, or struck by you at any point this\nsession. Monsters too, and corpses as well - a dead bandit shows,\na dead shopkeeper does not.=只有想伤害你的才会被点亮和标注：天生敌对、正在攻击你、\n或本次游戏中被你打过的。怪物同理，尸体也一样——\n死掉的强盗会显示，死掉的店主不会。
Skip empty containers=跳过空容器
