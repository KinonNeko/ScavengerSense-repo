Divisions cut across the bar. 0 draws it smooth.=横切状态条的分隔线。设为 0 则不分段。
Depth=纵深
Sets each row further back than the one above, shortening it to\nmatch, so the three read as a panel angled away rather than three\nflat stickers. 0 stacks them square.=让每一行比上一行更靠后一些，长度也相应缩短，\n于是三条看起来像一块朝里倾斜的面板，而不是三张贴纸。\n设为 0 则整齐叠放。
