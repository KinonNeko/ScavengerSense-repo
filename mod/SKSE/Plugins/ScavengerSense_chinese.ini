From your first hit until the fight ends, anyone you have struck\nkeeps bars over their head - no sweep needed.\n\nIf you run TrueHUD, its recent-damage bars already cover this -\nleave it off rather than drawing two.=从你打出第一下起到战斗结束，被你打中的人头顶都会一直\n挂着状态条——不需要扫描。\n\n如果你在用 TrueHUD，它的受击血条已经覆盖了这个功能——\n与其画两份，不如把这里关掉。
Also their magicka and stamina=同时显示他们的法力和耐力
Its own switch, separate from the sweep one above: health-only\nin a fight and all three on a sweep is a sensible pairing.=独立于上面扫描的开关：战斗中只看生命、扫描时看全三条，\n是完全合理的搭配。
Linger after the fight=战斗结束后保留
How long the bars outlive the fight, and how long a fresh corpse\nkeeps its drained bar so the kill reads.=状态条在战斗结束后还保留多久，以及刚倒下的尸体的\n空条保留多久——好让你看清这一杀。
Over my head=我的头顶
