When fatigue or cold pulls your maximum down, the bar keeps its\nfull length and the missing span becomes a dead zone - instead of\nthe bar quietly rescaling and pretending nothing happened.=当疲劳或严寒压低你的上限时，状态条保持原长，缺失的部分\n变成一段死区——而不是悄悄换算长度、假装什么都没发生。
