Bars over other people too=也显示他人的状态条
For the length of a sweep only, everyone the wave reached gets the\nsame bars - through walls, across the whole radius, all at once.\n\nDeliberately not persistent. A bar over everybody all the time is\nwhat a combat HUD mod is for, and it will do it better than this.=仅在扫描持续期间，被波及到的每个人都会显示同样的状态条——\n穿墙可见，覆盖整个半径，一次全部呈现。\n\n这是刻意不做成常驻的。要给所有人常挂血条，那是战斗界面模组的活，\n而且它们做得更好。
Their magicka and stamina too=同时显示他们的法力和耐力
Off draws health only, which is usually all you wanted to know.=关闭则只显示生命值，通常你想知道的也就是这个。
For whom=显示对象
Only someone just hurt=只显示刚受伤的
Hide the interface=隐藏界面
Hide the game's HUD=隐藏游戏原版界面
Hides the compass, health bars, crosshair, subtitles and the\nactivation prompt. They are all one piece as far as the game is\nconcerned, so they go together or not at all.\n\nPairs with the corner readout on the People page: no permanent\ninterface, and a sweep when you want to know how you are doing.=隐藏指南针、状态条、准星、字幕和交互提示。\n在游戏看来它们是同一个整体，所以只能一起隐藏。\n\n可以和“人物”页的角落显示搭配：平时没有任何常驻界面，\n想知道自己状态如何就扫一下。
Menus to hide=要隐藏的菜单
Comma separated, and case sensitive. "HUD Menu" is the game's own,\nand carries anything drawn into it - moreHUD among them.\n\nOther mods own their own menus, so add their names here to take\nthose too. What cannot be reached this way at all is a mod drawing\nthrough ImGui rather than Scaleform - including this one. There is\nno general switch for those, by anyone.=用逗号分隔，区分大小写。“HUD Menu”是游戏原版的界面，\n画在它上面的东西也会一并隐藏，比如 moreHUD。\n\n其他模组有各自的菜单，把名字加进来就能一起隐藏。\n完全够不着的是用 ImGui 而非 Scaleform 绘制的模组——\n包括本模组自己。这类界面谁也没有通用开关。
Currently hidden: see the log=当前隐藏情况：见日志
Only people hostile to me=只显示对我敌对的人
Bars only over people who actually want you dead, so a sweep\nthrough a town stays quiet and a sweep through a bandit camp\ntells you what you are walking into.\n\nRead from the game's own hostility check rather than a faction\nlist, so a modded enemy counts too. Rivals - people who dislike\nyou but have not drawn a weapon - do not.=只给真正想杀你的人显示状态条：在城镇里扫描会很安静，\n在强盗营地扫描则会告诉你要面对什么。\n\n用的是游戏自身的敌对判定，而不是派系名单，所以模组添加的敌人\n也算数。而“仇敌”——讨厌你但还没拔武器的人——不算。

