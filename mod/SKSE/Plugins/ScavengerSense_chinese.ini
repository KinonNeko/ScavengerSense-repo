Make a new title=新建称号
New title=新称号
For names containing=名字包含
Who gets it: anybody whose name contains one of these pieces,\ncomma separated - "Guard, Watch" catches both. Your own titles\noutrank the built-in ones.=谁能得到它：名字包含其中任意一段的人，用逗号分隔——\n"Guard, Watch"两个都能匹配。你自己建的称号优先于内置的。
