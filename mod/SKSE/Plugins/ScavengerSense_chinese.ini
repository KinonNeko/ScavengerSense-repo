Three bars under your name for as long as a sweep lasts.\n\nOnly yours. A bar over everybody in the radius is a wall of colour,\nand anyone you are actually fighting already has one if you run a\ncombat HUD mod.\n\nThis is meant for playing with the game's HUD hidden: sweep when you\nwant to know how you are doing.=扫描期间在你名字下方显示三条状态条。\n\n只显示你自己的。给半径内每个人都加状态条会变成一片色块，\n而且你正在交战的对象，如果装了战斗界面类模组，本来就有血条。\n\n这个功能是为关掉游戏原版界面来玩而设计的：想知道自己状态如何，扫一下就行。
Off means a bar only appears when that one is below maximum, so a\nhealthy, rested character shows nothing at all and a hurt one shows\nexactly what is low.=关闭后，只有低于上限的那一条才会出现；所以状态良好时什么都不显示，\n受伤时则正好显示哪一项偏低。

