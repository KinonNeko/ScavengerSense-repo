How long a bar set to "when something changes" stays visible after\nthe value moves, and how much of that it spends fading out.\n\nShared by all three, so the readout and the bars over other people\nnever disagree about how long a change is worth showing.=设为“数值变化时”的状态条，在数值变动后显示多久，\n其中有多长时间用于淡出。\n\n三处共用同一组数值，所以角落显示和他人状态条\n对“一次变化值得显示多久”不会出现分歧。
