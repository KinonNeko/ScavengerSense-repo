; ============================================================================
;  Scavenger Sense - 简体中文
;
;  格式：每行一条  英文原文=译文
;  等号左边必须与插件里的英文一字不差，包括大小写和标点。
;  提示文字里的换行写成 \n ，原文本身含有的等号写成 \= 。
;  找不到的条目会自动回退到英文，所以这个文件不需要写全也能用。
;
;  中文字形来自 SKSE Menu Framework 的菜单字体。如果菜单里全是方块，
;  请把 SKSE\Plugins\SKSEMenuFramework.ini 中的 EnableChinese 设为 true。
;
;  本文件必须以 UTF-8 保存。
;
;  按键名称（A、F1、小键盘之类）故意留成英文——键帽上印的就是这些。
; ============================================================================


; -- 颜色剪贴板 --
copy=复制
Put this colour on the clipboard.=把这个颜色放到剪贴板。
paste=粘贴
Take the clipboard colour.=使用剪贴板里的颜色。
Copy a colour somewhere first.=请先在某个颜色旁点击“复制”。
clipboard=剪贴板
empty - press copy beside any colour=空 —— 在任意颜色旁点击“复制”

; -- 快捷键 --
Hotkey=快捷键
Key=按键
press any key or mouse button - Esc cancels=请按任意按键或鼠标键，Esc 取消
Press a key to bind=按下要绑定的键
Clear=清除
Unbinds the key. The gamepad button is set separately, below.=解除这个键的绑定。手柄按键在下面单独设置。
Exact scan code=精确扫描码
For a key the list above does not have. Mouse buttons are 256 left,\n257 right, 258 middle. -1 unbinds.=用于上面列表里没有的按键。鼠标键：256 左键，257 右键，258 中键。\n填 -1 表示不绑定。
Gamepad button=手柄按键
The button keeps doing its normal job as well, so pick a spare one.=这个键原本的功能还会保留，所以挑一个平时用不到的。
Activate on=触发方式
Double tap and hold leave the ordinary press free for whatever else\nthe key already does.=双击和长按会把普通的一次按下让出来，留给这个键原本的功能。
Max gap between taps=两次点击的最大间隔
How long you have to get the second tap in.=第二下必须在多久之内按出来。
Hold for=长按时长
How long to hold. It fires while you are still holding, no need to let go.=需要按住多久。时间一到就触发，不用松手。
Press again to cancel=再次按下可取消
Cooldown=冷却时间
Chime when the sweep starts=扫描开始时播放提示音
A short two-note chime. The sound itself is the file\nSound\\FX\\ScavengerSense\\sweep.wav - overwrite it with any wav\nto make it yours. It plays through the game's UI audio, so the\ngame's own volume sliders apply on top.=一段短促的双音提示。声音就是\nSound\\FX\\ScavengerSense\\sweep.wav 这个文件——用任意 wav 覆盖\n即可换成自己的。它走游戏的界面音频通道，\n所以游戏自己的音量滑条也会叠加生效。
Chime volume=提示音音量
1.00 plays the file as loud as it is. The game engine can only\nturn a sound down, not up - so if it is still too quiet at full,\nreplace the wav with a louder one.=1.00 表示按文件本身的响度播放。游戏引擎只能把声音调小、\n不能调大——如果开到最大还是太轻，就换一个更响的 wav。
Chime=提示音

; -- 扫描范围 --
Scan=扫描
Radius=半径
How far the sweep reaches. 1500 is about 23 metres, 2500 about 38.=扫描能扫多远。1500 约 23 米，2500 约 38 米。
Max objects=最多物体数
How many things one sweep can light at once. 128 is the maximum.=一次扫描最多能同时点亮多少东西。上限是 128。
Ignore unnamed objects=忽略没有名称的物体
Skips the invisible markers the game litters the world with.=跳过游戏散布在世界各处的隐形标记。
Ignore harvested plants=忽略已采集的植物
Ignore placeholder names=忽略占位符名称
Some objects wear the engine's placeholder name - "This should\nnot be visible." on ore veins and the like - and the sense would\notherwise take the game at its word and show it. The match list\nis editable in the INI for localised or modded placeholders.=有些物体挂着引擎的占位符名称——矿脉之类的\n"This should not be visible."——感知会照单全收地显示出来。\n匹配列表可在 INI 中编辑，以适配汉化或模组的占位符。
Spread picks across the radius=在整个半径内分摊名额
Favour nearby=偏向近处
Higher keeps more of what is close to you and less of what is far away.\n1.0 treats near and far the same. 2.2 is a good middle.=数值越高，越多保留近处的东西、越少保留远处的。\n1.0 表示远近一视同仁，2.2 是比较合适的折中。
When there is more to light than there is room for, spread it over the\nwhole radius. Off, the wave never gets past the first few metres.=当要点亮的东西比名额还多时，把它们分摊到整个半径上。\n关闭时，扫描波永远走不出眼前这几米。

; -- 脉冲 --
Pulse=脉冲
Sweep time=扫描波用时
How long the wave takes to reach the furthest thing it lights.\n0 lights everything at once.=扫描波走到最远那个目标所需的时间。\n填 0 则所有东西同时亮起。
Highlight duration=高亮持续时间
Fade in=淡入
Fade out=淡出

; -- 视觉 --
Vision=视觉
See through walls=穿墙可见
Glows show through walls and other objects. Things behind a closed door\nstill will not show - the game is not drawing them at all.=辉光可以穿过墙壁和其它物体显示。关着的门后面的东西仍然看不到——\n游戏根本没有在画它们。
Edge falloff=边缘衰减
Higher gives a thin rim. Lower fills more of the object with light.=数值越高，光边越细；越低，被光填满的部分越多。
Glow strength=辉光强度
Brightness of the glow. Above 1.0 the colours wash towards white.=辉光的亮度。超过 1.0 颜色会往白色靠。
Throb amount=脉动幅度
Throb speed=脉动速度

; -- 名称标签 --
Name tags=名称标签
Show names on lit objects=为高亮的物体显示名称
Names appear and fade with the glow, so they arrive with the wave.=名字随辉光一起出现和消退，所以它们是跟着扫描波来的。
Dark backdrop=深色背板
Label distance=标签显示距离
Only name things closer than this. 0 names everything.=只给比这个距离更近的东西加名字。填 0 则全部都加。
Text size=文字大小
How big the name text is, in pixels.=名字文字的大小，单位为像素。
People are this much bigger=人物标签放大倍数
People get bigger tags than objects, above the head rather than at the feet.=人物的标签比物体大，而且挂在头顶而不是脚下。
Merge identical tags within=合并同名标签的范围
Folds identical names that are close together into one, so a cellar reads\n"Wine x40" instead of forty overlapping words. 0 keeps them separate.\nPeople are never folded.=把靠得很近的同名标签合并成一个，于是酒窖里显示“葡萄酒 x40”，\n而不是四十个叠在一起的词。填 0 则不合并。\n人物永远不会被合并。
Tags follow what they name=标签跟随它所标注的对象
Tags stay over people as they walk about. Off, a tag stays where the\nperson was standing when the wave reached them.=人走动时标签会跟着他。关闭时，标签会停在扫描波扫到他时他所站的位置。
Friend or foe marker=敌友标记
A shape beside a person's name: triangle hostile, circle stranger,\ndiamond ally, heart lover, cross body.=在人名旁边画一个图形：三角形敌对，圆形陌生人，菱形盟友，\n心形爱人，十字尸体。
Star your favourites=为收藏的物品加星
Anything you have favourited in your inventory gets a star, its own\ncolour and a bigger tag. Handy for the alchemy ingredients you use.=你在物品栏里收藏过的东西会得到一颗星、一个专属颜色和更大的标签。\n对常用的炼金材料很好用。
Favourite colour=收藏物颜色
Favourite size=收藏物大小
needs SKSE Menu Framework 3.13 or newer=需要 SKSE Menu Framework 3.13 或更新版本
the menu font covers Chinese characters, so names will read correctly=菜单字体包含中文字形，名称可以正常显示
the menu font has no Chinese characters, so names will show as '?' - see the readme=菜单字体不含中文字形，名称会显示成“?”—— 请参阅说明文件

; -- 声纳环 --
Sonar ring=声纳环
Ring travels out from your feet=光环自脚下向外扩散
The ring follows the ground, climbing stairs and rolling over hills.=光环会贴着地面走，能爬上楼梯、翻过山坡。
Ring colour=光环颜色
Line width=线宽
Halo width=光晕宽度
A soft glow behind the ring. 0 leaves a clean thin line.=光环后面的一层柔光。填 0 只剩一条干净的细线。
Echoes=回波圈数
How many rings trail behind the front one. 1 draws just the front.=领头那圈后面还跟着几圈。填 1 只画最前面一圈。
Echo spacing=回波间隔
Height off ground=离地高度
Overshoot=超出距离
How far the ring carries on past the last thing it lit.=光环越过最后一个被点亮的东西之后还要再走多远。

; -- 画面着色 --
Screen tint=画面着色
Desaturate while sensing=感知时抽走色彩
Drains the colour from the world while a sweep runs, so the highlights\nare the only strong colour on screen.=扫描期间抽走世界的色彩，让高亮成为画面上唯一鲜明的颜色。
Saturation=饱和度
1.0 is normal colour. 0.0 is fully grey.=1.0 是正常色彩，0.0 是全灰。
Brightness=亮度
Contrast=对比度
Blend=混合强度
Colour cast=色调
Cast amount=色调强度
Tints the world itself, rather than laying a sheet of colour over it.=给世界本身上色，而不是在上面盖一层色纸。
Use the old image space modifier instead=改用旧的 image space modifier
An older way of doing the same thing. Only worth trying if the tint does\nnothing under your ENB.=实现同一效果的旧办法。只有当你的 ENB 下着色完全没效果时才值得一试。
Community Shaders mode (own shader pass)=Community Shaders 模式（自带着色器通道）
Turn this on if you use Community Shaders and the tint does nothing.\nIt also draws a proper vignette. If it cannot run it turns itself off\nfor the session and the overlay below takes over.=如果你在用 Community Shaders 而着色没有效果，就打开这一项。\n它同时会画出更像样的暗角。万一无法运行，它会在本次游戏中自行关闭，\n改由下面的叠加接手。
Grade the back buffer=处理后缓冲区
Leave this on. Off is slightly cheaper but can tint the interface\ninstead of the world.=保持开启。关掉稍微省一点，但有可能染到界面而不是世界。
shader pass=着色器通道
Vignette overlay=暗角叠加
Darkens the edges of the screen and leaves the middle clear.=压暗屏幕四周，中间保持干净。
Overlay colour=叠加颜色
Overlay strength=叠加强度
Flat share=均匀铺满的比例
How much of the overlay covers the whole screen rather than just the\nedges. All the way up looks like coloured film.=叠加中有多少铺满整个屏幕、而不是只集中在边缘。开到最大像蒙了层彩色胶片。

; -- 类别与人物关系 --
Categories=类别
what lights up, in what colour, and how it is drawn=点亮什么、用什么颜色、以及怎么画
Actors to sense=感知哪些人物
Bodies count as people - they can be looted. Dead only is for finding a\nkill in tall grass.=尸体也算人——它们可以搜刮。“仅尸体”适合在深草里找刚打死的猎物。
One colour per row, used for both the glow and the name tag.\n\nCopy and paste move a colour between rows. Dragging one swatch onto\nanother does the same.=每一行一个颜色，辉光和名称标签都用它。\n\n用“复制”和“粘贴”在行之间搬颜色。把一个色块拖到另一个上面效果相同。
Colour people by disposition=按敌友关系为人物着色
Colours people by whether they are friendly or about to attack, instead\nof all the same colour. Replaces the People colour below.=按对方是友好还是即将动手来着色，而不是所有人一个颜色。\n会取代下面的“人物”颜色。
Read the relationship record too=同时读取关系记录
Also tells a rival from a stranger, and a friend from a lover, before\nanyone has drawn a weapon.=还能在谁都没拔武器之前，分辨出不和的人与陌生人、朋友与爱人。
Hostile=敌对
Neutral=中立
Rival or foe=不和
Friend=朋友
Lover=爱人
Ally or follower=盟友或随从
Dead=尸体
outline only=仅描边
Outline draws just the rim, so two people standing one behind the other\nstay readable as two shapes.=描边只画轮廓，这样一前一后站着的两个人还能看成两个形体。
Paste into every category=粘贴到所有类别
Paste into every tier=粘贴到所有关系层级
Sets every colour in the group at once. To undo, reload your INI or a preset.=一次设置这一组里的所有颜色。想还原就重新载入 INI 或某个预设。

; -- 行为、语言、操作 --
Behaviour=行为
Stand down while a menu is open=菜单打开时暂避
Hides everything while a menu is open, so nothing is drawn over it.\nTurn it off if the sweep ever refuses to run at all.=菜单打开时把一切隐藏起来，避免画到界面上面。\n如果扫描完全不肯运行，就关掉它。
End the sweep, do not just hide it=直接结束扫描，而不只是隐藏
Ends the sweep instead of hiding it, clearing the glow off everything.=直接结束扫描而不是隐藏，同时清掉所有物体上的辉光。
Mute during conversation=对话时不触发
Keeps a sweep from going off in the middle of a conversation.=避免扫描在对话进行到一半时触发。
Language=语言
Menu language=菜单语言
Applies straight away.\nChinese also needs EnableChinese \= true in SKSEMenuFramework.ini, or\nevery character shows as a box.=立即生效。\n中文还需要在 SKSEMenuFramework.ini 中把 EnableChinese 设为 true，\n否则所有字符都会显示成方块。
Actions=操作
Reload INI=重新载入 INI
Restore defaults=恢复默认值
Verbose logging=详细日志
Records every object a sweep lights, for working out why something is\nmissing.=记录扫描点亮的每一个物体，用来查清某样东西为什么没出现。
Draw this marker at all.=是否绘制这个标记。
built-in heart shape (no icon file)=内置心形（没有图标文件）
Colour=颜色
Tally=计数方式
number: the count is written beside the marker.\nfilling icon: the marker fills up as the count rises.\nno tally: just the marker.=数字：把计数写在标记旁边。\n填充图标：计数越高，标记填得越满。\n不计数：只画标记。
Full at=填满所需
The count at which the symbol is completely full.=计数达到多少时符号算完全填满。
shows a faction rank as the number=把派系等级显示为数字
counts the different things done together=统计一起做过多少种不同的事
no number, just the marker=不显示数字，只显示标记
Explain for my target=解释我瞄准的这个人
Nothing under the crosshair. Look at somebody and press it again.=准星下没有东西。对准某个人再按一次。
Aim at somebody, open this menu and press it. Every line is listed and\nticked if it applies to them.=对准某个人，打开这个菜单再按下。所有行都会列出来，符合的会打勾。
only the ticked lines=只看打勾的行
The whole list is below. "6 of 41" means six of the forty-one things this rule counts have happened, and six is the number on the tag.=完整列表就在下面。“6 of 41”表示这条规则统计的四十一件事里有六件发生过，标签上显示的就是这个 6。

; -- 你自己 --
You=你自己
Tag me too=也给我自己加标签
Puts a name tag on your own character too. You never get a glow.=也给你自己的角色加上名称标签。你永远不会被加上辉光。
Show what I am=显示我现在是什么
A shape beside your name: a standing figure while mortal, fangs while\nvampiric, three claw marks as a werewolf or in beast form.=在你名字旁边画一个图形：凡人是站立的人形，吸血鬼是獠牙，\n狼人或兽人形态是三道爪痕。
My colour=我的颜色
My tag size=我的标签大小
On top of the size people's tags already get.=在人物标签本身的放大倍数之上再乘一次。

; -- 自定义标记 --
Custom markers=自定义标记
Who each marker applies to is set in the marker file. How it looks is set here, and your styling is saved with a preset.=每个标记适用于谁，是在标记文件里定的；它长什么样在这里定，而这些样式会随预设一起保存。
no rules loaded=没有载入任何规则
every rule here belongs to an add-on - see the Add-ons page=这里的规则全都属于某个扩展 —— 请到“扩展”页查看
Reload rules=重新载入规则
Reads the marker files again, so you can edit them without restarting.=重新读取标记文件，这样你改完不用重启游戏。
Show a flame on the tag=在标签上显示火焰
A small flame to the right of the name, empty at 0 and full at 100.=名字右侧的一小簇火焰，0 时是空的，100 时填满。
Flame colour=火焰颜色
Hide below=低于此值不显示
Raise this so only people worth noticing carry a flame.=把它调高，让只有值得注意的人才带着火焰。
Print the figure too=同时显示数值
The figure comes from the other mod and only moves when that mod looks at somebody, roughly every half minute and only nearby - so a flame can be a little behind the moment.=这个数值来自另一个模组，只有当那个模组去看某个人时才会变化，大约每半分钟一次，而且只看附近的人——所以火焰可能比当下的情况慢半拍。
While somebody is speaking=当有人正在说话时
Their subtitle already shows their name, so ours is in the way.\nHide is tidier. Lift keeps both, one above the other.=对方的字幕已经显示了名字，我们的标签就是在挡路。\n“隐藏”更清爽；“抬高”则两个都留，一上一下。
Lift by=抬高
How far above the subtitle the name tag sits.=名称标签比字幕高出多少。
Swap the symbol when the tally fills=计数满时更换符号
Turns Dibella's sigil into Mara's once the count is full. Only a picture,\nnothing else changes.=计数满了之后，把蒂贝拉的符号换成玛拉的。只是换张图，别的什么都不变。
Writes to your save=会写入你的存档
Everything else in this mod only changes what you see. What follows changes the game.=本模组其余的一切只改变你看到的东西。下面这些会改变游戏本身。
Raise the relationship when the tally fills=计数满时提升关系
This is saved in your game and stays there even if you uninstall this\nmod. There is no undo, though the old value is written to the log so you\ncan put it back by hand.\n\nIt only ever raises a relationship, never lowers one, and it skips\ngeneric NPCs where the change would not stick anyway.=这会保存进你的游戏，即使卸载本模组也依然存在。没有撤销功能，\n不过原来的数值会写进日志，你可以照着手动改回去。\n\n它只会提升关系，绝不降低；对于改动本来就留不住的通用 NPC 会直接跳过。
Raise to=提升到
Friend is the gentlest option and is enough for marriage. Lover also\nlets you take up to 500 gold of their belongings without it counting as\ntheft, which you may not want.=“朋友”是最轻微的选项，而且已经足够结婚。“爱人”还会让你拿走对方最多\n500 金币的东西而不算偷窃——你未必想要这个副作用。
Also make them marriageable=同时让对方可以结婚
Makes them a marriage candidate. A wedding still needs a relationship of\nFriend or better and a voice the ceremony has lines for.=让对方成为可结婚的候选。举办婚礼仍然需要关系达到“朋友”或以上，\n以及一种婚礼有台词的声线。
A small word above the name saying what somebody is - Jarl, Blacksmith, Follower. Worked out from the game, and you can overrule it for anybody.=名字上方的一个小词，说明这个人是什么——领主、铁匠、随从。由游戏内容判断得出，你也可以为任何人手动覆盖。

; -- 称号 --
Show titles=显示称号
Title size=称号大小
As a share of the name below it. 0.72 reads as a subtitle.=相对下方名字的比例。0.72 看起来像一行副标题。
Let each title pick its own colour=让每个称号用自己的颜色
Off makes every title the one colour below, which is calmer in a crowd.=关掉之后所有称号统一成下面那个颜色，人多时更清爽。
Title colour=称号颜色
Worked out from the game=从游戏中判断出来的
no titles loaded=没有载入任何称号
Untick one and the next matching title takes over. "copy" puts the\ntitle's text in the box below, ready to give to somebody.=取消勾选后，由下一个符合条件的称号顶上。“复制”会把该称号的\n文字放进下面的输入框，随时可以授予别人。
Titles you give out yourself=你自己给出的称号
Title=称号
Give it to my target=给我瞄准的这个人
Type a title first.=请先输入一个称号。
saved=已保存
could not write the title file=无法写入称号文件
Gives whoever you are aiming at the title you typed. Yours wins over\nanything the mod worked out, and it is kept after a restart.=把你输入的称号给你正瞄准的人。你写的优先于模组自己判断的结果，\n重启游戏后依然保留。
Give it to me=给我自己
forget=移除
Reload titles=重新载入称号
