One key: a press marks or releases what the aim finds, and the\nwipe rides its own gesture. A key per action splits everything,\nhide and show included. All on the sweep key folds the whole\nhunt onto one button: double tap sweeps, a lone press marks,\na hold wipes.=单键模式：一按即标记或解除准星所指目标，清除走它\n自己的手势。一动作一键则全部拆开，包括隐藏与显示。\n"全部交给扫描键"把整场狩猎折进一个按钮：\n双击扫描，单击标记，长按清除。
The sweep key above carries everything. Double tap to sweep; a lone press marks once the window rules a second tap out; hold to wipe.=上方的扫描键承担一切。双击扫描；单击在判定窗口排除第二击后进行标记；长按清除。
The lone press waits out the double-tap window before it\nmarks, so a sweep's first tap never takes anybody - marking\ngains that little delay in exchange for the single button.\nThe sweep's Activate-on setting stands aside on this key,\nand stray presses outside the hunt are quietly ignored.=单击会先等完双击判定窗口再标记，因此扫描的第一击\n永远不会误选目标——用这一点延迟换来单键操作。\n此键上扫描的"触发方式"设置暂不生效，\n狩猎之外的误按会被安静忽略。
This is also the sweep key - the sweep would never fire. Pick another key, or the All on the sweep key layout.=这也是扫描键——扫描将永远无法触发。请换一个键，或选用"全部交给扫描键"布局。
Stats row=属性行
The gesture that marks or releases what the aim finds. When it\ncollides with the wipe below, the wipe wins the press.=标记或解除准星所指目标的手势。与下方的清除手势\n冲突时，以清除为准。
Sweep key=扫描键
The trail key lives on the Keys page.=足迹键在"按键"页设置。
The settings menu itself opens on SKSE Menu Framework's key - F1 out of the box, set in its own INI.=设置菜单本身由 SKSE Menu Framework 的按键打开——默认 F1，在其自己的 INI 中修改。
What shows=显示内容
Things=物品
Colours=颜色
Names to skip=要跳过的名称
Add what the crosshair sees=加入准星所指之物
Some objects wear the engine's placeholder name - "This should\nnot be visible." on ore veins and the like. A localised game\ntranslates that string, so if they still show, add what yours\nactually says below - or aim at one and press the button.=有些物体顶着引擎的占位名——矿脉之类的"This should\nnot be visible."。汉化版游戏会翻译这句话，所以如果它们\n仍然出现，就在下面填上你游戏里实际显示的文字——\n或者瞄准一个再按按钮。
Some objects wear the engine's placeholder name - "This should\nnot be visible." on ore veins and the like. The English and\nChinese strings are built in; if a mod or another language shows\none, add what it says below - or aim at it and press the button.=有些物体顶着引擎的占位名——矿脉之类的"This should\nnot be visible."。英文与中文的占位名已内置过滤；\n若模组或其他语言出现了别的写法，在下面填上它——\n或者瞄准它再按按钮。
Aim the crosshair at the offending object, open this menu and\npress. Its exact name - in your game's language - joins the\nlist.=把准星对准碍眼的物体，打开本菜单按下按钮。\n它的名称——就是你游戏语言里的那个——\n会加入列表。
A chest with nothing in it neither lights nor gets a tag. Saves\nwalking to a barrel that holds air - but respawning containers\nyou have cleared stay dark until they refill.=空无一物的箱子既不会发光也不会有标签。省得白跑一趟去开\n一个只装着空气的木桶——但已被你清空的可刷新容器\n在重新装满之前会一直保持沉默。
Own the enemy bars=接管敌人血条
While the combat bars are on, this mod becomes the only place\nenemy health is shown: TrueHUD's whole overlay is hidden - the\nsure way to silence its target widget even when another mod's\ntarget lock is feeding it - and the game's own enemy health bar\nis parked off screen. Everything is handed back the moment\neither box is unticked.=战斗状态条开启期间，本模组成为敌人血量的唯一来源：\n整个 TrueHUD 覆盖层都会被隐藏——即使别的模组（如目标\n锁定）还在给它的目标挂件喂数据也无济于事——原版敌人\n血条则被挪到屏幕之外。任一开关关闭时立刻全部归还。

; -- 足迹 --
Tracks=足迹
Recording=记录
Drawing=绘制
Marking=标记
Print size=脚印大小
Print spacing=脚印间距
How many recorded marks lie between drawn prints. 1 prints at\nevery mark; higher spreads the prints out.=每隔多少个记录点画一个脚印。1 表示每个记录点\n都画；数值越大脚印越稀疏。
Trails show=足迹显示时机
Crouch and sense=潜行加感知
Any sweep=任意扫描中
While crouching=潜行时
When trails show is also when the trail key works. Crouch and\nsense is the hunt: kneel, open the sense, and the ground stays\nreadable - and markable - until that sweep ends, even if you\nstand; a sweep opened standing shows no footprints. While\ncrouching needs no sweep at all. A marked quarry shows always.=足迹显示之时也是足迹键生效之时。"潜行加感知"即狩猎本身：\n蹲下开启感知，地面便可读——也可标记——直到该次扫描结束，\n即使中途站起；站立时开启的扫描不显示脚印。\n"潜行时"则完全不需要扫描。\n被标记的猎物始终显示。
Tracking messages=追踪提示消息
The corner notes - Tracking Hulda, All trails wiped. Untick for\na silent hunt.=角落里的小字提示——"正在追踪胡尔达""所有足迹已清除"。\n取消勾选即可安静狩猎。
Nothing under the aim to mark=准星下没有可标记的目标
Crouch to read the ground=蹲下以读取地面
Aim at someone - or their footprints - and press to track them. Hold to wipe everything.=瞄准某人——或其脚印——按下即开始追踪。长按清除一切。
One key: a press marks or releases what the aim finds, and the\nwipe rides its own gesture - showing is the reveal rule's job.\nOr split the actions across keys of your choosing, hide and\nshow included, each with its own gesture.=单键模式：一按即标记或解除准星所指目标，清除走它自己的\n手势——显示与否由显示规则决定。也可以把各动作分到\n你选定的按键上，包括隐藏与显示，各配各的手势。
People leave trails=人物留下足迹
Anyone the sense has touched - sweep-lit or fought - leaves\nchevrons on the ground pointing the way they went, fading as they\nage. Hostile trails draw in the hostile colour.\n\nRecording starts when the sense first sees somebody: nobody's\npast is known before that, and a trail ends where its owner\nleft the loaded world.=凡是被感知触及过的人——被扫描点亮或交过手的——都会在\n地上留下一串指向去向的箭头，随时间淡去。敌对者的足迹\n用敌对色绘制。\n\n记录从感知第一次看到对方时开始：在那之前谁也无从得知，\n足迹也终止于其主人离开已加载世界的地方。
Trail lifetime=足迹保留时间
Name the trails=标注足迹归属
A small label at the fresh end of the trail - whose footprints\nthese are.=在足迹最新的一端加一个小标签——这是谁的脚印。
{}'s footprints={} 的足迹

; -- 足迹：样式、清除与快捷键 --
Drawn as=绘制样式
Chevrons=箭头
Footprints=脚印
Chevrons point the way they went. Footprints alternate left and\nright like real tracks, with the toes ahead.=箭头指向去向。脚印像真实足迹一样左右交替，\n脚尖朝前。
Forget trails when I change place=换地方时忘掉足迹
An interior's marks are nonsense outside it, so trails are wiped\nwhen you pass a load door or change worldspace. Untick to keep\nthem anyway.=室内的坐标在室外毫无意义，所以穿过读取门或切换世界时\n足迹会被清空。取消勾选则保留。
An interior's marks are nonsense outside it, so trails are wiped\nwhen you pass a load door or change worldspace. A marked quarry\nis spared: their trail pauses, keeps recording wherever they\nare loaded, and each stretch shows in the place it was laid.=室内的坐标在室外毫无意义，所以穿过读取门或切换世界时\n足迹会被清空。被标记的猎物除外：其足迹暂时收起，\n无论对方在哪里加载都继续记录，\n每一段都只在留下它的地方显示。
Forget marked trails as well=被标记的足迹也一并忘掉
The hunt ends at the door: changing place releases every mark\nand wipes their trails with the rest. Leave off to track someone\nacross cells.=狩猎止步于门前：切换地点时解除所有标记，\n其足迹随其余一同清空。保持关闭\n即可跨区域追踪目标。
Trail key=足迹快捷键
Press it to hide or show every trail. Aim at someone and press it to track them.=按下即隐藏或显示所有足迹。瞄准某人再按，即开始追踪对方。
Aim at someone and press it to track them; press at nothing to hide or show trails. Hold it to wipe everything.=瞄准某人按下即开始追踪；对空按下则隐藏或显示足迹。长按清除一切。
Aim at someone - or their footprints - and press it to track them; press at nothing to hide or show trails. Hold it to wipe everything.=瞄准某人——或其脚印——按下即开始追踪；对空按下则隐藏或显示足迹。长按清除一切。
All trails wiped=所有足迹已清除
Press a key to bind##trail=按下要绑定的键
Clear##trail=清除
Gamepad button##trail=手柄按键
unbound=未绑定
Tracked people leave a gold trail that never fades while they are near.=被追踪的人留下金色足迹，只要在附近就不会消失。
Tracking {}=正在追踪 {}
No longer tracking {}=不再追踪 {}
Trails hidden=足迹已隐藏
Trails shown=足迹已显示
Marking reach=标记距离
Marking sign=标记指示
Frame corners=四角框
Ring at the feet=脚下光环
Chevron overhead=头顶箭标
The sign over whoever the key would take. On a trail it is\nalways running dots marching toward the fresh end, in the same\ncolour.=按键将选中的目标身上显示的指示。指向足迹时\n则始终是一串向最新一端行进的光点，\n颜色相同。
Sign colour=指示颜色
For targets not yet marked. One already marked shows their own\nmark colour instead, so you know a press would release them.=用于尚未标记的目标。已标记的目标会显示自己的标记色，\n提示这一按将解除标记。
Wipe everything by=清除一切的方式
Control layout=按键布局
One key does it all=一键全能
A key per action=一动作一键
One key reads the aim: a target marks, empty ground hides or\nshows, and the wipe rides its own gesture. Or split the three\nactions across keys of your choosing, each with its own\ngesture - the same key twice with different gestures works.=一个键随准星行事：有目标即标记，对空则隐藏或显示，\n清除走它自己的手势。也可以把三个动作分到\n你选定的按键上，各配各的手势——\n同一个键配不同手势也可以。
Mark what I aim at=标记我瞄准的目标
Hide and show trails=隐藏与显示足迹
Wipe everything=清除一切
Gesture=手势
Shared by every action whose gesture is a hold; the double\ntap shares the sweep key's window.=所有以长按为手势的动作共用此时长；\n双击与扫描键共用判定窗口。
Hold the key=长按按键
Double-tap it=双击按键
Never=从不
The clean slate: every mark, trail and open recording goes at\nonce. Pick the gesture, or take it off the key entirely.=一键清空：所有标记、足迹和进行中的记录同时清除。\n选择手势，或干脆不绑定在按键上。
Sneaking reads the ground=潜行读取地面
Crouch and every trail shows, the trail key working with them,\nsweep or no sweep - the tracker's stance is its own kind of\nsense. Stand and they fade back behind the gate.=蹲下时所有足迹显现，足迹键随之可用，无论是否在扫描中\n——追踪者的姿态本身就是一种感知。站起后\n它们又退回感知的门后。
Release a dead quarry=放走死去的猎物
A hunt ends at the kill: once the target has been dead this\nlong, the mark slips off and the trail ages away on its own.=狩猎止于猎杀：目标死亡达到此时长后，\n标记自行脱落，足迹随时间自然消散。
Dead for=死亡后
How far the mark can pick somebody out. It aims by view - the\ncreature nearest your screen centre within reach - so a deer\nacross a valley is fair game.=标记能选中多远的目标。它按视线取的——取距离内最靠近\n屏幕中心的那个——所以山谷对面的鹿也逃不掉。
Marking needs an open sense=标记需要感知开启
Marking only works while a sweep is live, as if the sense itself\nis what latches on. Hiding and showing trails always works.=只有扫描进行中才能标记，就像是感知本身在锁定目标。\n隐藏和显示足迹随时可用。
The sense is closed - sweep first to mark=感知未开启——先扫描再标记
Trails only while sensing=仅在感知中显示足迹
The whole apparatus lives inside the sense: trails draw, and the\ntrail key works, only while a sweep is live. Recording continues\neither way, and a marked quarry's trail stays lit regardless -\nthe mark is the point.=整套装置都活在感知之内：只有扫描进行时足迹才会绘制、\n足迹键才起作用。记录无论如何都在继续，\n而被标记猎物的足迹始终点亮——\n标记本身就是意义所在。
Capture everyone on arrival=抵达时捕捉所有人
Capture everyone around=捕捉周围所有人
Everyone loaded leaves a trail, no sweep needed - those already\nthere when you arrive, and those the world streams in as you\ntravel. The picture is complete but busier, and costs a little\nmore memory.=所有已加载的人都会留下足迹，无需扫描——你抵达时\n已在场的，以及旅途中世界陆续加载进来的。\n画面更完整但也更繁杂，并多占用一点内存。
Entering a new place starts a trail behind every loaded person\nand creature at once, no sweep needed. The picture is complete\nbut busier, and costs a little more memory.=进入新地点时立即为每个已加载的人和生物记录足迹，\n无需扫描。画面更完整但也更繁杂，\n并多占用一点内存。
Track several at once=同时追踪多个目标
Off, a new mark replaces the old - a hunt has one prey. On, each\nmark takes its own colour, and the sweep glow over a marked\nperson agrees with their trail. Hold the key half a second to\nrelease everything at once.=关闭时，新标记会替换旧的——一次狩猎只有一个猎物。\n开启时每个标记有自己的颜色，被标记者在扫描中的辉光\n与其足迹同色。按住快捷键半秒\n即可一次解除全部。
A marked quarry glows in their mark colour on every sweep.=被标记的猎物在每次扫描中都以其标记色发光。
All marks released=已释放全部标记

Bars only over people who actually want you dead - judged by\nthe engine's own hostility check, so modded enemies count.\nRivals who have not drawn a weapon do not.=只给真想要你命的人挂状态条——由引擎自己的敌意判定\n决定，模组添加的敌人也算。没拔武器的\n对头不算。
For the length of a sweep only, everyone the wave reached gets\nbars - through walls, all at once. Deliberately not persistent:\na bar over everybody all the time is what a combat HUD is for.=仅在扫描期间，波及到的每个人都会有状态条——隔墙、\n一齐出现。刻意不做常驻：给所有人常挂状态条\n是战斗 HUD 模组的事。
The same bars pinned to a corner, sweep or no sweep - the one\nthat works in first person. Pair it with hiding the game's own\nHUD on the Setup page.=同样的条钉在屏幕一角，扫描与否都显示——第一人称\n就靠它。配合"设置"页隐藏游戏自带 HUD 使用。
The same stack the combat bars use, following you in third\nperson. In first person there is no head to hang them over -\nthat is what the corner readout below is for.=与战斗状态条相同的一组，第三人称下跟随你。\n第一人称没有头顶可挂——那是下面\n角落面板的用途。
Three bars under your name for as long as a sweep lasts. Needs\n"Tag me too" on the What shows page, since they hang off the tag.=扫描期间在你名字下方显示三条。需要"显示内容"页的\n"也标注我"，因为它们挂在名牌上。
Turn on the people category on the What shows page, or a sweep\nnever reaches anybody and there is nothing to put a bar over.=在"显示内容"页开启人物类别，否则扫描碰不到任何人，\n也就没有可挂状态条的对象。
While the combat bars are on, this mod is the only enemy health\non screen: TrueHUD's overlay is hidden and the vanilla bar is\nparked off screen. Both come back when either box is unticked.=战斗状态条开启期间，本模组是屏幕上唯一的敌人血量来源：\nTrueHUD 覆盖层被隐藏，原版血条被挪出屏幕。任一开关\n取消勾选即全部归还。

; -- 状态栏位置 --
Where the stats live=状态栏位置
Riding my overhead bars=跟随我的头顶状态条
Under the corner readout=角落面板下方
Both=两处都要
Riding the overhead bars keeps everything about you in a single\nglance - the full-HUD way to play. The row follows whichever\nstack it is attached to.=跟随头顶状态条能让关于你的一切集中在一瞥之内——\n完整 HUD 的玩法。状态栏跟着它所依附的那组条走。

; -- 玩家感知页 --
Player=玩家
About me=关于我
Drawn as a stats row under the corner readout.=以一行状态栏画在角落面板下方。
Race beside the level=等级旁显示种族
A racial emblem - a horned helm for a Nord, cat ears for a\nKhajiit - marks the level instead of repeating the weapon shape,\nwith fangs or a paw after it for a vampire or werewolf. On other\npeople it sits before their weapon icon.=一个种族徽记——诺德是带角的头盔，凯季特是猫耳——\n作为等级的标志，不再重复武器的图形；吸血鬼和狼人\n在其后跟着獠牙或爪印。在其他人身上\n它位于武器图标之前。
A small chip from the race name - No for Nord, Im for Imperial -\njoins the level, so the level's mark stops repeating the weapon\nshape. On other people it sits before their weapon icon.=取自种族名的小徽记——诺德为 No，帝国人为 Im——\n伴随等级显示，等级的标记就不再重复武器的图形。\n在其他人身上它位于武器图标之前。
My level=我的等级
My septims=我的赛普汀金币
My carry weight=我的负重
Current over maximum. It turns hostile red when you are\nover-encumbered.=当前值/上限。超载时会变成敌对红色。
How cold I am=我有多冷
Read from a survival mod's global variable - Survival Mode's out\nof the box. Point coldGlobal in the INI at another mod's variable\nto use that instead; the row hides itself when none exists.=读取生存类模组的全局变量——开箱即用的是官方生存模式。\n在 INI 里把 coldGlobal 指向其它模组的变量即可换用；\n变量不存在时此行自动隐藏。
About everyone=关于所有人
Levels after names=名字后显示等级
Their level in parentheses after the name, on tags and combat\nbars alike - enemies very much included. Knowing you are\noutmatched is the point.=名字后面用括号标出等级，标签和战斗状态条上都有——\n敌人当然也在内。知道自己打不过，正是这个功能的意义。
Icons follow the drawn weapon=图标跟随所持武器
The shape beside a name becomes what they are holding - sword,\nbow, spell - instead of the relationship marker. Yours too. The\ncolour still says friend or foe.=名字旁的图形变成对方手里的东西——剑、弓、法术——\n而不是关系标记。你自己的也一样。颜色仍然表示敌友。

; -- 杂项（0.7 新增） --
Ally=盟友
Confidant=知己
hide their tag=隐藏其标签
lift their tag=抬高其标签
leave them alone=保持不动
