People still have to be lit for this to show.=还需要人物本身会被点亮，这些才会显示。
Turn on the People category on the People page, or a sweep never\nreaches anybody and there is nothing to put a bar over.=请在“人物”页打开人物这一类别，否则扫描根本不会覆盖到人，\n也就没有对象可以加状态条。
Health, magicka and stamina are on the Vitals page.=生命、法力和耐力在“状态”页。

