; ============================================================================
;  Scavenger Sense - marker rules
;
;  Put your own symbol over whoever you like. Each [Section] is one rule:
;  if an actor matches ANY of its match lines, that rule applies, and the
;  highest priority wins when several do.
;
;  Icons are PNG files in Data\SKSE\Plugins\ScavengerSense\icons\ . They are
;  tinted by the rule's colour, so a white glyph on transparency comes out in
;  whatever colour you ask for. Any size; 128x128 is plenty. Leave `icon` out
;  and the built-in relationship shape is used instead.
;
;  Match lines - all take a comma separated list:
;
;    icon        = name.png            picture in the icons folder
;    iconFull    = name.png            shown instead once the tally is full
;    keyword     = File.esm|0xFORMID   an actor keyword
;    faction     = File.esm|0xFORMID   faction membership, including ranks
;                                      added at runtime by other mods
;    formList    = File.esp|0xFORMID   membership of a FormList
;    npc         = File.esm|0xFORMID   one specific NPC, or their base form
;    nameContains= some text           substring of the displayed name
;
;  And some optional extras:
;
;    countFaction= File.esp|0xFORMID   a faction whose RANK on that person is
;                                      shown as a number beside the icon
;    countLists  = File.esp|0x1, ...   one line = one point of the tally; the
;                                      point is scored if the person is in any
;                                      list on that line. The line's trailing
;                                      comment is the name shown by the menu's
;                                      "Explain for my target" button.
;    countMin    = 1                   hide the number below this
;    countCap    = 101                 shown as "101+" at the ceiling
;
;    integration = OStim               groups this rule under one on/off switch
;                                      in the menu, named after the mod it reads
;    requires    = OStim.esp           the plugin this rule needs; if it is not
;                                      in the load order the menu says so and
;                                      the rule stays quiet
;
;  Faction ranks are how most mods keep a per-NPC tally, so countFaction turns
;  any such tally into a number on the tag.
;
;  Forms are named File|LocalID, never a raw runtime FormID - the runtime one
;  changes with load order, and this way an ESL-flagged plugin works too. A
;  reference to a file you do not have simply does not match; the rule stays
;  live for whatever else it names.
;
;  ADD-ONS. Rules that read another mod live in their own file, named
;  ScavengerSense_marks_<something>.ini next to this one. Every such file is
;  read automatically. Delete one and its add-on disappears completely - no
;  rules, no marker, and nothing left in the menu to switch off.
;
;  uniqueOnly = true (the default) refuses to mark generic NPCs. This matters:
;  most things that record what someone has done record it against their BASE
;  form, and every bandit in Skyrim shares one base. Without this, marking one
;  of them marks all of them.
; ============================================================================


; ---------------------------------------------------------------------------
;  Your spouse. PotentialMarriageFaction rank 3 is "married to the player" in
;  vanilla; rank 1 is "available". Faction membership is read from the actor,
;  so runtime rank changes count.
; ---------------------------------------------------------------------------
[Spouse]
icon = spouse.png
color = 0xFFD24A
priority = 90
faction = Skyrim.esm|0x00019809


; ---------------------------------------------------------------------------
;  Examples, off by default - delete the leading semicolons to use them.
; ---------------------------------------------------------------------------

; Everyone in the Companions.
;[Companions]
;icon = talos.png
;color = 0x9BE04F
;priority = 40
;faction = Skyrim.esm|0x00048362

; A specific person.
;[Serana]
;icon = daedric.png
;color = 0xC08CFF
;priority = 100
;npc = Dawnguard.esm|0x00002B6C

; Anyone whose name contains a word. Cheap and surprisingly useful for
; follower packs that all share a naming convention.
;[Court wizards]
;icon = mara.png
;color = 0x4FA3FF
;priority = 20
;nameContains = Wizard, Court Mage

; A keyword some other mod distributes. This is the general escape hatch:
; anything that can put a keyword or a faction on an actor can drive a marker
; here without either mod knowing about the other.
;[Tagged]
;icon = daedric.png
;color = 0xFF6FD8
;priority = 50
;keyword = SomeMod.esp|0x00000800
