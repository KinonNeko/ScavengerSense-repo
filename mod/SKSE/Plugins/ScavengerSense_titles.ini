; ---------------------------------------------------------------------------
;  The catch-all.
;
;  Everything above this names a faction, and factions only cover the people
;  the game had a reason to sort. Most of Skyrim is not in any of them: a
;  villager, a beggar, a bandit, a soldier, a hired thug. They have no station,
;  no trade and no guild, and until this rule they got no title at all.
;
;  Every NPC does have a CLASS, though, and most classes carry a name the game
;  already shows you elsewhere - Citizen, Farmer, Warrior, Bandit, Soldier,
;  Vampire, Priest. `fromClass` matches anybody whose class has one and uses it
;  as the title, so a single rule covers the long tail, including every class a
;  mod adds without anybody having to list it.
;
;  It sits at the very bottom of the priority order, so it only ever speaks
;  when nothing better has. Untick it in the menu if you would rather have
;  titles only on people who earned one.
; ---------------------------------------------------------------------------
[Class]
color = 0x9A9A9A
priority = 5
player = false
fromClass = true


