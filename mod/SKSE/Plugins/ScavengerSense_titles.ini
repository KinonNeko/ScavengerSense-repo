; ============================================================================
;  Scavenger Sense - titles
;
;  A small word above somebody's name saying what they are to Skyrim - Jarl,
;  Blacksmith, Thane of Whiterun - rather than what they are to you. The
;  relationship colours already answer "what is this person to me"; this
;  answers "who is this person".
;
;  Each [Section] is one title. If an actor matches ANY line in it, that title
;  applies, and the highest priority wins when several do. Only one title is
;  ever drawn: two words over one head is worse than the wrong one.
;
;  Lines - all take a comma separated list unless noted:
;
;    text        = Some Words         what is drawn. Defaults to the section name.
;    color       = 0xRRGGBB           its colour, if the menu is letting each
;                                     title choose one
;    priority    = 50                 higher wins
;
;    faction     = File.esm|0xFORMID  membership, including ranks added at
;                                     runtime by other mods
;    minRank     = 0                  minimum rank on a matched faction
;    vendor      = true               ANY faction they are in that the game
;                                     itself flags as a merchant. Far better
;                                     than a list of shop factions, because the
;                                     flag is on the record and every modded
;                                     shopkeeper carries it too.
;    questDone   = EditorID           a quest that has been completed. Quests
;                                     are one of the few records that keep
;                                     their editor ID at runtime, so they can
;                                     be named the way modders name them.
;    class       = File.esm|0xFORMID  the NPC's class record
;    fromClass   = true               matches ANYBODY whose class has a name,
;                                     and uses that name as the title. This is
;                                     the one that gives broad coverage - see
;                                     the note at the bottom of this file.
;    keyword     = SomeKeywordName    or File.esm|0xFORMID. A keyword's editor
;                                     ID is the name the game itself matches
;                                     on, so it can simply be typed. This is
;                                     the one to pair with SPID - see the
;                                     bottom of this file.
;    formList    = File.esp|0xFORMID
;    npc         = File.esm|0xFORMID  one specific person, or their base form
;    nameContains= some text
;
;    player      = true               may apply to you (the default)
;                = false              never applies to you
;                = only               applies to you and to nobody else
;    enabled     = true               off ships a title without using it
;
;  Faction editor IDs are not kept at runtime, so factions have to be named by
;  form ID. That is why the numbers below are here and why they are commented.
;
;  ABOUT THANE. There is no thane faction and no thane keyword. Thanehood is
;  recorded as the completion of a per-hold favour quest, one for each of the
;  nine holds - and Riften's does not follow the naming of the other eight.
;  Because quests keep their editor IDs, those can be matched by name, which
;  also means this works for you rather than only for other people.
;
;  If a title is wrong or missing, the numbers are all editable here. Nothing
;  in the menu ever rewrites the rules above the [Assigned] block at the end.
; ============================================================================


; ---------------------------------------------------------------------------
;  You. Thanehood is the one title worth carrying yourself.
; ---------------------------------------------------------------------------
[Thane]
color = 0xFFD24A
priority = 100
player = only
questDone = Favor250   ; the Reach
questDone = Favor252   ; Haafingar
questDone = Favor253   ; Whiterun
questDone = Favor254   ; Eastmarch
questDone = Favor255   ; Hjaalmarch
questDone = Favor256   ; the Pale
questDone = Favor257   ; Winterhold
questDone = Favor258   ; Falkreath
questDone = FreeformRiftenThane   ; the Rift, which breaks the pattern


