; ---------------------------------------------------------------------------
;  TITLING WHOLE GROUPS YOU INVENT YOURSELF
;
;  Most people never need this. Between fromClass, vendor, the vanilla
;  factions and questDone, nearly everybody already gets a title.
;
;  But if you want a grouping the game does not have - "every Nord woman in
;  Whiterun is a Shieldmaiden" - the tool is Spell Perk Item Distributor.
;  SPID hands out a keyword to whoever you describe, and a rule here matches
;  that keyword by name. No form IDs, no Creation Kit, no patch.
;
;  In some MyTitles_DISTR.ini beside SPID:
;
;      Keyword = ShieldmaidenTag|ActorTypeNPC|NONE|NONE|F/Nord
;
;  and here:
;
;      [Shieldmaiden]
;      priority = 45
;      keyword  = ShieldmaidenTag
;
;  Distribute a KEYWORD, not a faction. Keywords are inert - nothing in the
;  game reads one unless it was written to. Faction membership feeds crime,
;  aggression, dialogue and who counts as an ally, so putting half of Skyrim
;  into a faction to label them will change how the game behaves.
;
;  The keyword has to exist in some plugin you have. Skyrim ships thousands
;  and most mods add more, so there is usually one that already means what
;  you want.
; ---------------------------------------------------------------------------


; ============================================================================
;  Below this line is written by the menu. Everything above it is left alone.
;
;  One person per line, beating every rule above:
;
;      File.esp|0xFORMID = Their Title      ; a note to yourself, optional
;      Skyrim.esm|0x1A692 = Court Poisoner  ; Nazeem
;
;  The form ID is the local one - the last six digits as the plugin stores
;  them, or the last three for an ESL - so this survives a load order change.
;  Typing a title onto somebody in the menu writes the same line here.
; ============================================================================
[Assigned]
