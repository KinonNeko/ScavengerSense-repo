"When something changes" keeps the screen clear until a value\nmoves - taking a hit, casting, drinking, or regenerating - then\nshows the bars for a few seconds and fades them out again.="When something changes" keeps the screen clear until a value\nmoves - taking a hit, casting, drinking, or regenerating - then\nshows the bars for a few seconds and fades them out again.
"When something changes" uses the same linger and fade the other\nbars do, set under Bar style.="When something changes" uses the same linger and fade the other\nbars do, set under Bar style.
0 keeps the original scene. 1 applies the full tint and vignette configured below. Turn this down if sensing looks too dark or too bright.=0 keeps the original scene. 1 applies the full tint and vignette configured below. Turn this down if sensing looks too dark or too bright.
1.0 is normal colour. 0.0 is fully grey.=1.0 is normal colour. 0.0 is fully grey.
1.0 keeps the original brightness. Lower darkens the scene; higher brightens it. The screen-effect strength controls how much is applied.=1.0 keeps the original brightness. Lower darkens the scene; higher brightens it. The screen-effect strength controls how much is applied.
1.00 plays the file as loud as it is. The game engine can only\nturn a sound down, not up - so if it is still too quiet at full,\nreplace the wav with a louder one.=1.00 plays the file as loud as it is. The game engine can only\nturn a sound down, not up - so if it is still too quiet at full,\nreplace the wav with a louder one.
