; ============================================================================
;  Scavenger Sense - "Oathvein" preset
;
;  A palette taken from the Oathvein UI mod's own configuration files rather
;  than guessed at: TrueHUD.ini, deardiary_dm/config.txt, moreHUDIE/config.txt
;  and PhotoMode/styles.ini. Oathvein is near-monochrome - bone white on
;  charcoal - with muted earth accents and exactly one warm gold. So:
;
;    people          are the only saturated things on screen
;    hostile CC2929  is Oathvein's own sStrongerColor
;    rival   8C372E  its sHealthFlashColor
;    neutral CBCBCB  its phantom grey
;    friend  86AF79  its sTeammateColor
;    dead    696969  its sWeakerColor
;    objects         sit in bone, leather, slate and olive - present, quiet
;    gold FFA600     its sSpecialColor, kept for things you favourited
;
;  Everything added since the first version of this preset is set to match:
;
;    your own tag    Oathvein's default ink, EBEBEB
;    titles          left on their own colours, which were themselves picked
;                    out of this palette; the fallback is moreHUD's 999999
;    arousal         D98F86, the rose the lover tier and the Dibella marker
;                    already use, and hidden below 20 so a street is not full
;                    of flames
;    speaking        tags hide while somebody talks, since a floating subtitle
;                    is already saying their name
;    Mara at full    on. It is only a picture, and a sigil changing is exactly
;                    the kind of quiet detail this UI is built on
;
;  The relationship writing stays off. A preset should not change your save.
;
;  Everything that is not a colour - hotkey, radius, timings, tally settings -
;  is copied from your settings as they were when this was written, so loading
;  it changes the look and nothing else.
; ============================================================================

[General]

; Write per-object detail to
; Documents\My Games\Skyrim Special Edition\SKSE\ScavengerSense.log
debug = false

; Menu language. "english", or any name with a matching
; Data\SKSE\Plugins\ScavengerSense_<name>.ini translation file.
language = english

; Stand down while a game menu is open, so nothing we draw or tint
; ends up on top of it. Turn this off if the sweep ever refuses to
; run - some HUD mods park a permanent menu on the stack.
menuAware = true

; End the sweep when a menu opens instead of just hiding it. This
; also strips the glow off every lit object.
stopOnMenu = true

; Treat a conversation the same way. Talking does not pause the game,
; so this has to be asked for by name - but a pulse going off while
; someone is mid-sentence breaks the scene more than a menu does.
muteInDialogue = true


[Hotkey]

; DirectX scan code of the key that triggers a sweep. Mouse buttons are
; 256 + button index (256 = LMB, 257 = RMB, 258 = MMB). -1 disables.
; Scan code list: https://ck.uesp.net/wiki/Input_Script
keyboard = 21

; Gamepad button, or -1 to disable. Xbox layout, SKSE macro codes:
;   266 D-Pad Up      267 D-Pad Down   268 D-Pad Left   269 D-Pad Right
;   270 Start/Menu    271 Back/View    272 Left Stick   273 Right Stick
;   274 Left Bumper   275 Right Bumper 276 A            277 B
;   278 X             279 Y            280 Left Trigger 281 Right Trigger
; The press is not swallowed, so the button still does its vanilla job too.
gamepad = 276

; How the button has to be pressed:
;   press  - fires the moment it goes down
;   double - two taps inside doubleTapWindow
;   hold   - held down for at least holdTime
trigger = double

; Maximum seconds between the two taps in double mode.
doubleTapWindow = 0.3

; Seconds the button must be held in hold mode.
holdTime = 0.45

; Pressing the key again while a sweep is running cancels it.
toggle = false

; Minimum seconds between sweeps.
cooldown = 0.5


[Scan]

; Radius in game units. 1500 is roughly 23 m, 2500 roughly 38 m.
radius = 2500

; Hard cap on objects per sweep, nearest first. Maximum 128.
maxObjects = 128

; Skip objects with no display name (invisible marker activators).
ignoreUnnamed = true

; Skip plants and ore veins you have already harvested.
ignoreHarvested = true

; When more objects qualify than there are slots, spread the picks
; evenly across the whole radius instead of taking the nearest ones.
; Without this the wave only covers the few metres around you.
spreadAcrossRadius = true

; How hard that spread leans toward what is near you.
;   1.0 = even. Sounds fair, is not: with 450 candidates and 96 slots
;         it keeps one object in five, and the crate at your feet is
;         as likely to be dropped as one across the valley.
;   2.2 = everything within a few paces survives, the far half is
;         sampled. This is the default.
;   4.0+ = almost everything near, only a token few at distance.
nearBias = 2.2


[Pulse]

; Seconds for the wave to travel from the nearest lit object to the
; furthest one. This is a time, not a speed, so the sweep reads the
; same whether the objects are spread out or packed into one room.
;   0 = no wave, everything lights on the same frame.
sweepTime = 1.2

; How long each object stays lit once the wave reaches it.
duration = 3

; Seconds spent fading a highlight in and out.
fadeIn = 0.15
fadeOut = 0.4


[Vision]

; Draw the glow regardless of depth - silhouettes through geometry.
; Note this defeats the depth test, not culling: an object the engine
; never submits still will not show.
throughWalls = true

; Higher = thinner rim, lower = the whole object glows.
edgeFalloff = 1.6

; Multiplies the category colours. Above 1.0 pushes toward white.
glowStrength = 1

; Throb. Amplitude 0 is a steady glow.
pulseAmplitude = 0.35
pulseFrequency = 1.2


[Labels]

; Draw the object's name over it while it is lit.
enable = true

; Dark plate behind the text so it stays readable.
backdrop = false

; Only label objects closer than this, in game units. 0 = no limit.
; A busy room can otherwise turn into a wall of text.
maxDistance = 1800

; Text height in pixels. The menu framework only ever bakes one font
; size and it is sized for menus, so tags are drawn scaled to this.
; 0 uses the menu size unchanged.
fontSize = 20

; People's tags are drawn this much bigger than an object's, and are
; placed over the head rather than at the base of the model.
actorScale = 1.4

; Draw a shape beside a person's name: a triangle for hostile, a
; circle for neutral, a diamond for an ally, a cross for a corpse.
; These are drawn as geometry, not glyphs, so no font can lose them.
icons = true

; Give things you have favourited a colour of their own and a
; slightly bigger tag. Favourites are a per-save inventory flag, so
; this is read fresh from the player on every sweep.
favourite = true
favouriteColor = 0xFFA600
favouriteScale = 1.2

; Fold tags with the same name that sit within this many units of
; each other into one, so a wine cellar reads "Wine x40" instead of
; forty overlapping words. 0 disables. People are never folded -
; two guards are two guards.
mergeDistance = 320

; Push tags that land on top of each other apart. The one nearest
; the camera keeps its position and the rest step upward, each with
; a hairline back down to what it names. declutterSteps caps how far
; a tag may be lifted before it gives up and overlaps anyway.
follow = true
speakerMode = 1
speakerLift = 90

declutter = true
declutterSteps = 6


[Ring]

; The ground ring that travels outward from your feet with the wave.
; It is drawn as real world-space points, so it climbs stairs and
; follows hills rather than sitting flat on the screen.
enable = true

color = 0xD6DCE0

; Line width in pixels, and the width of the soft halo behind it.
thickness = 2.5
glow = 6

; Trailing rings behind the leading edge, and the gap between them.
; 1 draws only the leading edge.
echoes = 3
echoGap = 0.09

; Lift above the ground, so the line does not fight with the floor.
height = 10

; How much further than the furthest lit object the ring travels.
; Above 1.0 it keeps going past the last highlight, which reads as
; the pulse carrying on into the distance.
lead = 1.35


[Tint]

; Desaturate and darken the world while the sweep runs.
; This drives the image space override the tonemapper reads, so it is
; a real desaturation and it survives Community Shaders.
enable = true

; Two ways in, both on by default. They carry identical values, so
; there is no cost to pushing on both, and which one actually reaches
; the frame depends on what owns the tonemapper.
;   useOverride  - ImageSpaceManager's spare override pointer
;   writeCurrent - write the live image space, restoring it after
useOverride = true
writeCurrent = true

; Old route: trigger the IMAD record shipped in the esp instead.
; Only useful under ENB presets that ignore the cinematic params.
useImageSpaceModifier = false

; Run our own full-screen shader pass after everything else in the
; frame. This is the only route that works under Community Shaders,
; because nothing runs after it to undo the result. It also takes
; over the vignette, doing it properly rather than with four
; gradient quads. Off until you ask for it: it is the one part of
; this mod that talks to the graphics pipeline directly. Any failure
; disables it for the session and says why in the log.
postProcess = true

; Multipliers applied to the current image space. 1.0 leaves alone.
; saturation 0.0 is full greyscale.
saturation = 0.35
brightness = 0.82
contrast = 1.18

; Overall blend of the effect, 0.0 to 1.0.
strength = 1

; Colour graded into the image while sensing, and how much of it.
castColor = 0x3A4A57
castAmount = 0.22

; Composited overlay drawn on the finished frame. Mostly a vignette:
; overlayFlat is the share of the strength spent as an even sheet of
; colour, the rest darkens the edges. All-flat looks like cellophane.
overlay = true
overlayColor = 0x141414
overlayStrength = 0.28
overlayFlat = 0.12


[Self]

; Tag yourself along with everything else. The sweep starts where you
; are standing, so your own tag appears on the first frame of it.
; You are never given a highlight - a glow around the camera is no use
; to anybody, and it would spend one of the 128 shader slots.
scan = true

; A shape beside your name saying what you currently are: a standing
; figure while mortal, a pair of fangs while vampiric, three claw marks
; while a werewolf or in vampire lord form.
icon = true

color = 0xEBEBEB
scale = 1.25

; The bar stack sits where the place rule puts it; no nudge needed
; against Oathvein's layout.
barOffsetX = 0
barOffsetY = 0


[Vitals]

; Show the ceiling a survival mod has pulled down as a dead zone, with
; the frost-and-smoke dressing - it reads as damage to the equipment,
; which suits the sense aesthetic.
lostMax = true
lostFx = true

; Combat bars stay off: this preset assumes the Oathvein stack, and
; TrueHUD is part of it - its recent-damage bars already cover a fight.
combat = false
combatAll = false
combatLinger = 4


[Titles]

; Titles keep the colours their own rules ask for - those were picked out of
; this same palette - with moreHUD's neutral grey as the fallback.
show = true
scale = 0.72
ruleColor = true
color = 0x999999


[Arousal]

; The rose the lover tier and the Dibella marker already use, so the three
; read as one idea. Hidden below 20, or a market street is all flames.
show = true
min = 20
number = false
color = 0xD98F86


[Bonds]

; Off. A preset changes how the mod looks; it has no business changing your
; save. The symbol swap is only a picture, so that one is on.
promote = false
promoteRank = 1
promoteMarriage = false
maraAtFull = true


[Sound]

; The shipped chime, at full volume - the engine can only turn a sound
; down from what the file carries.
enabled = true
volume = 1.0

; Raw form ID of a sound descriptor to play INSTEAD of the chime, 0
; uses the chime. Examples: 0x000C7A54 = MAGDetectLifeCast,
; 0x0003F925 = UIMenuOK
formID = 0x0


[Categories]

; Which kinds of object to light, and what colour each one glows (0xRRGGBB).

; Which actors to sense:
;   all    - anyone, corpses included. Corpses are lootable.
;   living - only the ones still breathing
;   dead   - only the bodies, for finding a kill in tall grass
actorFilter = all

; Colour people by what they are to you rather than by the fact that
; they are people. "Someone is there" is much less useful than
; "someone is there and they want to kill you". This overrides the
; actorColor below, for the glow and the name tag alike.
actorByDisposition = true
; Colour by the relationship record as well, so a rival reads
; differently from a stranger even when nobody has drawn a weapon.
actorByRelationship = true
hostileColor = 0xCC2929
neutralColor = 0xCBCBCB
friendlyColor = 0x86AF79
rivalColor = 0x8C372E
loverColor = 0xD98F86
allyColor = 0x7FA8C4
deadColor = 0x696969

; <name>OutlineOnly draws just the rim with no interior glow, which
; reads as a clean silhouette and keeps overlapping shapes separate.

container = true
containerColor = 0xC4B393
containerOutlineOnly = true

door = true
doorColor = 0x8FA3AD
doorOutlineOnly = true

flora = true
floraColor = 0x8FA86B
floraOutlineOnly = true

gear = true
gearColor = 0xC98F63
gearOutlineOnly = true

alchemy = true
alchemyColor = 0xA8C48F
alchemyOutlineOnly = true

book = true
bookColor = 0xA896C4
bookOutlineOnly = true

valuable = true
valuableColor = 0xD9A441
valuableOutlineOnly = true

activator = true
activatorColor = 0xB8B8B8
activatorOutlineOnly = true

actor = true
actorColor = 0xEBEBEB
actorOutlineOnly = true

[Markers]

; Appearance of the rules in ScavengerSense_marks.ini, matched by
; name. The rule file decides who a marker applies to; this decides
; what it looks like, so the menu can edit one without rewriting
; the other - and so a preset carries your marker styling with it.
;   style = number | fill | hidden
;   full  = the tally at which a filling icon is completely full

dibella.enabled = true
dibella.color = 0xD98F86
dibella.style = fill
dibella.full = 8

spouse.enabled = true
spouse.color = 0xFFA600
spouse.style = fill
spouse.full = 8
