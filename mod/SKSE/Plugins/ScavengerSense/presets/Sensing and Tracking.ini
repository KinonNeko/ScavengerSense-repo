; ============================================================================
;  Scavenger Sense - "Sensing and tracking", the same answer the installer
;  offers
;
;  The sense as in "Only sensing", plus the hunt: crouch, sweep, and everyone
;  the sense has touched leaves footprints you can follow across cells. Still
;  nothing touched about your interface.
;
;  This one changes only the settings its answer is about, exactly like the
;  installer fragment it mirrors - everything else stays where you have it.
;
;  It sets trails on explicitly, where the installer fragment leaves them at
;  the default. A preset has to: switching from "Only sensing" to this one
;  would otherwise leave the trails that preset turned off still off, and the
;  difference between the two answers is precisely the trails.
; ============================================================================

[Categories]
actor = true
actorFilter = living

[Tracks]
enabled = true
